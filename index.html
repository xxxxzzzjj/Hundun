// ============ 寻宝（8 个抽象宝箱 + 寻宝次数余额 + 真宝位置固定）============
// 每个玩家独立 8 格子（1 真宝 + 7 空，真宝位置固定，玩家 8 次内必中）
// 玩家点未开格子：
//   - 命中 → 给奖励 + 清空 session + 生成新的 8 格子（重置真宝位置）
//   - 未命中 → 该格子消失（图标不再显示）
// 顶部显示：寻宝次数余额 / 每日上限
// 每次点击 -1；第二天按每日上限重置（admin 可加额外次数保留）
// ============ 寻宝（双轴次数 + 点击即变灰色 + 找好友代抽）============
// 关键设计：用本地 Map `_treasureOpenedLocal` 缓存"本会话已点击"，渲染时合并后端 opened
// 这样点击瞬间就能看到格子变灰色 + 中心 -1，不依赖后端响应或 setTimeout 重渲染
const _treasureOpenedLocal = {};  // session 内：idx → true（已点击，本会话累计）
let _treasureOpenedSessionId = null;  // 记录当前所属玩家 ID，切换账号时清空本地
async function showTreasureHunt() {
  // 关键修复：只在切换账号时才清空本地缓存（不能每次打开都清，否则点击后立刻重渲染会丢失）
  if (_treasureOpenedSessionId !== curId) {
    for (const k of Object.keys(_treasureOpenedLocal)) delete _treasureOpenedLocal[k];
    _treasureOpenedSessionId = curId;
  }
  const getRes = await api('/api/treasure/get?id=' + encodeURIComponent(curId));
  if (getRes.error) {
    return showModal('🗺️ 寻宝', `<div class="empty">${escapeHtml(getRes.error)}</div>`, null, '关闭', null, true);
  }
  const st = getRes.state || {};
  const opened = Array.isArray(st.opened) ? st.opened : [];
  // 直接信任后端数据（不再叠加 _treasureOpenedLocal 本地缓存——避免 -2 bug）
  const isOpened = (idx) => !!(opened[idx]);
  const openedCount = Array.isArray(st.opened) ? st.opened.filter(Boolean).length : 0;
  const count = getRes.count || 0;
  const dailyUsed = getRes.daily_used || 0;
  const dailyLimit = getRes.daily_limit || 0;
  const dailyRemain = Math.max(0, dailyLimit - dailyUsed);
  const unopenedCount = Math.max(0, 8 - openedCount);
  const hasState = Array.isArray(st.boxes) && st.boxes.length === 8;
  const order = [
    { idx: 7 }, { idx: 0 }, { idx: 1 },
    { idx: 6 }, { center: true }, { idx: 2 },
    { idx: 5 }, { idx: 4 }, { idx: 3 },
  ];
  let gridHtml = '';
  for (const o of order) {
    if (o.center) {
      gridHtml += `<div style="background:rgba(255,215,0,.15);border:2px solid #ffd700;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1vw;">
        <div style="font-size:6vw;font-weight:bold;color:#ffd700;line-height:1;">${unopenedCount}</div>
      </div>`;
      continue;
    }
    if (isOpened(o.idx)) {
      // 已开 → 灰色占位（保持 3×3 视觉对齐）
      gridHtml += `<div style="background:rgba(255,255,255,.03);border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <div style="font-size:6vw;color:rgba(255,255,255,.15);line-height:1;">📦</div>
      </div>`;
      continue;
    }
    gridHtml += `<div class="treasure-pt" data-idx="${o.idx}" style="cursor:pointer;padding:0;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;">
      <div style="font-size:8vw;color:#ffd700;text-shadow:0 0 12px #ffd700;line-height:1;">📦</div>
    </div>`;
  }
  const body = `
    <div style="display:flex;justify-content:space-around;background:rgba(255,255,255,.04);padding:2vw;border-radius:6px;margin-bottom:2vw;">
      <div style="text-align:center;">
        <div style="font-size:2.4vw;color:rgba(255,255,255,.5);">🎫 奖券</div>
        <div style="font-size:4.6vw;font-weight:bold;color:#ffd700;line-height:1.2;">${count}</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:2.4vw;color:rgba(255,255,255,.5);">📅 今日剩余</div>
        <div style="font-size:4.6vw;font-weight:bold;color:${dailyRemain > 0 ? '#2ee84e' : '#ff4d5a'};line-height:1.2;">${dailyRemain}<span style="font-size:2.4vw;color:rgba(255,255,255,.5);"> / ${dailyLimit}</span></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;align-items:stretch;text-align:center;aspect-ratio:1;">
      ${gridHtml}
    </div>
  `;
  showModal('🗺️ 寻宝', body, null, '关闭', null, true, () => {
    document.querySelectorAll('#modal .treasure-pt[data-idx]').forEach(el => {
      el.onclick = async () => {
        const idx = el.dataset.idx;
        if (!idx) return;
        const idxNum = parseInt(idx);
        // 关键修复：先关 modal（视觉立刻响应），不再在 await 前调 showTreasureHunt 避免闪烁 + 重复累加
        closeModal();
        const r = await api('/api/treasure/dig', { dm: curId, idx: idxNum });
        if (r.error) {
          toast(r.error, 'err', 2000);
          showTreasureHunt();
          return;
        }
        // 同步最新玩家数据
        try {
          const me = await api('/api/login', { dm: curId });
          if (me.ok) { curPlayer = me.player; renderPlayer(); }
        } catch(e) {}
        // toast 结果
        if (r.hit && r.reward) {
          let rewardText = `【${r.reward.name}】`;
          if (r.reward.gold) rewardText += ` ${r.reward.gold} 玄币`;
          if (r.reward.item_id && r.reward.qty) rewardText += ` + ${r.reward.item_id} ×${r.reward.qty}`;
          if (!r.reward.gold && (!r.reward.item_id || !r.reward.qty)) rewardText = `【${r.reward.name}】（空空如也）`;
          toast(`🎉 ${rewardText}`, 'ok', 2500);
        } else {
          toast('空空如也…', 'err', 1500);
        }
        // session 结束（命中真宝或全开完）→ 清空本地标记
        if (r.session_completed) {
          for (const k of Object.keys(_treasureOpenedLocal)) delete _treasureOpenedLocal[k];
        }
        // 只调用 1 次 showTreasureHunt（用后端真实 r.opened_count 渲染，不再叠加本地）
        showTreasureHunt();
      };
    });
  });
}

// 通用选择 modal：rps 或 dice
function showDuelChooserModal({ duelId, game, selfRole, selfName, otherName, otherId, alreadyChosen }) {
  const key = 'choose:' + duelId;
  if (_duelIsOpen(key)) return;
  _duelMarkOpen(key);
  const gameLabel = game === 'rps' ? '剪刀石头布' : '摇骰子';
  const choices = game === 'rps'
    ? [{ v: 'rock', label: '✊ 石头' }, { v: 'paper', label: '✋ 布' }, { v: 'scissors', label: '✌️ 剪刀' }]
    : [{ v: 'big', label: '🔼 大' }, { v: 'small', label: '🔽 小' }];
  let body = `<div style="text-align:center;background:rgba(255,215,0,.1);padding:2vw;border-radius:6px;margin-bottom:2vw;">
    <div style="font-weight:bold;color:#ffd700;">⚔️ ${gameLabel}决斗</div>
    <div style="font-size:2.6vw;color:rgba(255,255,255,.6);margin-top:.5vw;">${escapeHtml(selfName)} vs ${escapeHtml(otherName)}</div>
  </div>
  <div style="font-size:3vw;color:rgba(255,255,255,.6);margin-bottom:2vw;text-align:center;">请选择你的${game === 'rps' ? '招式' : '方向'}：</div>
  <div style="display:flex;flex-direction:column;gap:2vw;">`;
  choices.forEach(c => {
    body += `<button data-choice="${c.v}" style="padding:3vw;background:rgba(255,215,0,.15);border:1px solid #ffd700;color:#fff;border-radius:8px;font-weight:bold;font-size:4vw;cursor:pointer;">${c.label}</button>`;
  });
  body += `</div>
  <div style="margin-top:2vw;font-size:2.6vw;color:rgba(255,255,255,.5);text-align:center;">
    ${selfRole === 'creator' ? '已通知对方等待回应…' : '等待你的选择…'}
  </div>`;
  // 用 hideOk=true 实现只有一个"关闭"按钮；同时支持"拒绝/取消"按钮
  // 用 afterRender 回调确保 modal body 已渲染（队列模式下 setTimeout 50ms 可能 modal 还没渲染）
  showModal(`⚔️ ${gameLabel} · 选择`, body, null, '关闭', () => {
    _duelMarkClosed(key);
    closeModal();
  }, true, () => {
    document.querySelectorAll('#modal [data-choice]').forEach(btn => {
      btn.onclick = async () => {
        const choice = btn.dataset.choice;
        const r = await api('/api/duel/choose', { dm: curId, duelId, choice });
        if (r.error) return toast(r.error, 'err');
        toast(`已选择：${choice}`, 'ok', 1200);
        _duelMarkClosed(key);
        // 关闭选择 modal，进入等待对方 modal
        closeModal();
        if (!r.settled) {
          showDuelWaitingModal(duelId, game, selfName, otherName);
        } else {
          // 已经结算（理论上不会，因为对方还没选；除非对方同时选完）
          // 关键：先 mark handledSettled，否则 3 秒后 pullSysTips 拉到 tip 会再弹一次结算 modal
          _duelState.handledSettled.add(duelId);
          _duelState.handledChosen.add(duelId);
          showDuelResultModal(r, selfName, otherName, game);
        }
      };
    });
    // 拒绝/取消按钮（仅对被邀请方显示）
    if (selfRole === 'opponent') {

// 显示决斗结果
function showDuelResultModal(result, myName, otherName, game) {
  const key = 'result:' + (result.duelId || '');
  const gameLabel = game === 'rps' ? '剪刀石头布' : '摇骰子';
  // 判断我方是赢/输/平：result.winnerId 与 curId 的关系
  const myId = curId;
  const opponentId = result.opponentId || (result.p1Id === myId ? result.p2Id : result.p1Id);
  let iWin = false, iLose = false;
  if (result.result === 'tie' || result.result === 'tie_sys') {
    // 平局：双方都不算赢/输
    iWin = false; iLose = false;
  } else if (result.result === 'sys_win' || result.result === 'p1_win_vs_sys') {
    // pve 模式：双方命运相同 —— p1_win_vs_sys 是赢、sys_win 是输
    iWin = (result.result === 'p1_win_vs_sys');
    iLose = !iWin;
  } else {
    // pvp 模式：winnerId 是谁，谁赢
    iWin = (result.winnerId && result.winnerId === myId);
    iLose = !iWin && !!result.winnerId;
  }

  // 推到系统提示栏（绿色：涉及"对拼其他玩家"的反馈）
  const gLabel = gameLabel;
  if (result.result === 'tie' || result.result === 'tie_sys') {
    sysTip(`【${myName}】与【${otherName}】${gLabel}决斗：平局`, 'chat');
  } else if (iWin) {
    sysTip(`【${myName}】对拼【${otherName}】${gLabel}获胜`, 'chat');
  } else if (iLose) {
    sysTip(`【${myName}】对拼【${otherName}】${gLabel}落败`, 'chat');
  } else if (result.result === 'p1_win_vs_sys' || result.result === 'sys_win') {
    // PVE 模式
    sysTip(`【${myName}】与【${otherName}】${gLabel}对决系统：${result.result === 'p1_win_vs_sys' ? '玩家阵营获胜' : '系统获胜'}`, 'chat');
  }

  let winText = '';
  let winColor = '#ff4d5a';
  const sign = (n) => (n > 0 ? `+${n}` : `${n}`);

  if (game === 'rps') {
    if (result.result === 'tie') {
      winText = `您与对方出的一样<br><span style="font-size:3vw;color:rgba(255,255,255,.6);">双方不扣不加</span>`;
      winColor = '#ffd700';
    } else {
      // p1_win / p2_win：赢方获得输方一半蓝条
      if (iWin) {
        winText = `🎉 你战胜了【${otherName}】！<br>获得对方一半蓝条 <b style="color:#2ee84e;">${result.p1SpiritDelta > 0 ? '+' + result.p1SpiritDelta : result.p2SpiritDelta > 0 ? '+' + result.p2SpiritDelta : ''}</b>`;
        winColor = '#2ee84e';
      } else {
        const loseDelta = result.p1SpiritDelta < 0 ? result.p1SpiritDelta : result.p2SpiritDelta;
        winText = `😢 你输给了【${otherName}】<br>损失一半蓝条 <b style="color:#ff4d5a;">${loseDelta}</b>`;
      }
    }
  } else {
    // 摇骰子
    const roll = result.p1Roll || 0;
    if (result.result === 'p1_win_vs_sys') {
      // 两玩家都 +1 蓝条（玩家赢）
      winText = `🎉 摇骰子：系统掷 <b style="color:#ffd700;">${roll}</b> 点（${roll <= 3 ? '小' : '大'}）<br>玩家阵营获胜！<br><span style="color:#2ee84e;">双方 ${sign(result.p1SpiritDelta || 1)} 蓝条</span>`;
      winColor = '#2ee84e';
    } else if (result.result === 'sys_win') {
      winText = `😢 摇骰子：系统掷 <b style="color:#ffd700;">${roll}</b> 点（${roll <= 3 ? '小' : '大'}）<br>系统获胜！<br><span style="color:#ff4d5a;">双方 ${sign(result.p1SpiritDelta || -2)} 蓝条</span>`;
    } else if (result.result === 'p1_win' || result.result === 'p2_win') {
      // pvp：根据我方 win/los 决定
      if (iWin) {
        winText = `🎉 摇骰子：系统掷 <b style="color:#ffd700;">${roll}</b> 点（${roll <= 3 ? '小' : '大'}）<br>你战胜了【${otherName}】！<br><span style="color:#2ee84e;">你 ${sign(result.p1SpiritDelta > 0 ? result.p1SpiritDelta : result.p2SpiritDelta)} 蓝条</span>`;
        winColor = '#2ee84e';
      } else {
        winText = `😢 摇骰子：系统掷 <b style="color:#ffd700;">${roll}</b> 点（${roll <= 3 ? '小' : '大'}）<br>你输给了【${otherName}】<br><span style="color:#ff4d5a;">你 ${sign(result.p1SpiritDelta < 0 ? result.p1SpiritDelta : result.p2SpiritDelta)} 蓝条</span>`;
      }
    }
  }

  const body = `<div style="text-align:center;padding:2vw;">
    <div style="font-size:5.6vw;color:${winColor};font-weight:bold;margin-top:2vw;line-height:1.5;">${winText}</div>
  </div>`;
  showModal(`${gameLabel} · 决斗结果`, body, async () => {
    try {
      const me = await api('/api/login', { dm: curId });
      if (me.ok) { curPlayer = me.player; renderPlayer(); }
    } catch(e) {}
    _duelMarkClosed(key);
    closeModal();
  }, '关闭', null, true);
}

// 全局钩子：处理 sys_tips 中的 meta（来自 pullSysTips）
window._handleDuelMeta = async function(meta, tip) {
  if (!meta || !meta.type) return;
  if (meta.type === 'friend_duel_invite') {
    if (_duelState.handledInvites.has(meta.duelId)) return;
    _duelState.handledInvites.add(meta.duelId);
    if (_duelIsOpen('choose:' + meta.duelId) || _duelIsOpen('waiting:' + meta.duelId)) return;
    // 弹窗让被邀请方选择（带拒绝按钮）
    showDuelChooserModal({
      duelId: meta.duelId,
      game: meta.game,
      selfRole: 'opponent',
      selfName: (curPlayer && curPlayer.name) || curId,
      otherName: meta.fromName || '对手',
      otherId: meta.fromId,
    });
  } else if (meta.type === 'friend_duel_chosen') {
    if (_duelState.handledChosen.has(meta.duelId)) return;
    _duelState.handledChosen.add(meta.duelId);
    // 对方已选 → 关闭等待 modal，弹窗轮到我选（creator 端）
    if (_duelIsOpen('waiting:' + meta.duelId)) {
      _duelMarkClosed('waiting:' + meta.duelId);
      closeModal();
      const list = await api('/api/duel/list?id=' + encodeURIComponent(curId));
      const duel = (list.ok && list.duels) ? list.duels.find(d => d.id === meta.duelId) : null;
      if (duel && duel.status === 'waiting' && duel.creator === curId && !duel.p1_choice) {
        showDuelChooserModal({
          duelId: meta.duelId,
          game: duel.game,
          selfRole: 'creator',
          selfName: (curPlayer && curPlayer.name) || curId,
          otherName: duel.opponent_name || meta.fromName || '对手',
          otherId: duel.opponent,
        });
      }
    }
    // 这里不能直接知道"对方"是谁；需要从 meta 取��—但当前 meta 没传 fromName
    // 不弹选择 modal，等下一轮 pullSysTips 时检测"对手已选"的事件即可（已在上面处理了）
  } else if (meta.type === 'friend_duel_declined') {
    if (_duelState.handledDeclined.has(meta.duelId)) return;
    _duelState.handledDeclined.add(meta.duelId);
    if (_duelIsOpen('waiting:' + meta.duelId)) {
      _duelMarkClosed('waiting:' + meta.duelId);
      closeModal();
    }
    toast('对方拒绝了你的决斗邀请', 'err', 2000);
  } else if (meta.type === 'friend_duel_settled') {
    // 关键修复：去重防止反复弹结算 modal（每次 pullSysTips 都会调到这里）
    if (_duelState.handledSettled.has(meta.duelId)) return;
    _duelState.handledSettled.add(meta.duelId);
    // 决斗已结算 → 关闭所有相关 modal，弹结果
    if (!_duelState.handledChosen.has(meta.duelId)) _duelState.handledChosen.add(meta.duelId);
    ['choose', 'waiting'].forEach(k => {
      if (_duelIsOpen(k + ':' + meta.duelId)) {
        _duelMarkClosed(k + ':' + meta.duelId);
        closeModal();
      }
    });
    // 拉决斗详情拿对方名
    const list = await api('/api/duel/list?id=' + encodeURIComponent(curId));
    const duel = (list.ok && list.duels) ? list.duels.find(d => d.id === meta.duelId) : null;
    const myName = (curPlayer && curPlayer.name) || curId;
    const otherName = duel
      ? (duel.creator === curId ? duel.opponent_name : duel.creator_name)
      : '对手';
    // 重新格式化 result 给 showDuelResultModal 用（新规则字段：p1SpiritDelta/p2SpiritDelta/winnerId）
    showDuelResultModal({
      result: meta.result,
      p1SpiritDelta: meta.p1SpiritDelta,
      p2SpiritDelta: meta.p2SpiritDelta,
      p1Roll: meta.p1Roll,
      p2Roll: meta.p2Roll,
      winnerId: meta.winnerId,
      p1Id: duel ? duel.creator : '',
      p2Id: duel ? duel.opponent : '',
      opponentId: duel ? (duel.creator === curId ? duel.opponent : duel.creator) : '',
      duelId: meta.duelId,
    }, myName, otherName, meta.game);
    // 刷新玩家数据（蓝条可能已变化）
    try {
      const me = await api('/api/login', { dm: curId });
      if (me.ok) { curPlayer = me.player; renderPlayer(); }
    } catch(e) {}
  }
};

function compressImage(file, maxKB) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 400;
        if (w > max || h > max) {
          if (w > h) { h = Math.round(max * h / w); w = max; }
          else { w = Math.round(max * w / h); h = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.85, data;
        const tryC = () => {
          data = canvas.toDataURL('image/jpeg', q);
          if (data.length > maxKB * 1024 * 1.4 && q > 0.3) { q -= 0.1; tryC(); }
          else resolve(data);
        };
        tryC();
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============ 健康衰减（前端计时）============
let healthTimer = null;
function startHealthTick() {
  if (!curPlayer) return;
  if (!curPlayer.lastHealthCheck) curPlayer.lastHealthCheck = Math.floor(Date.now() / 1000);
  if (healthTimer) clearInterval(healthTimer);
  healthTimer = setInterval(async () => {
    if (!curPlayer || !curPlayer.lastHealthCheck) return;
    const now = Math.floor(Date.now() / 1000);
    const elapsed = now - curPlayer.lastHealthCheck;
    if (elapsed >= 60) {  // 每分钟同步一次（精确到小时扣血）
      const hours = Math.floor(elapsed / 3600);
      if (hours >= 1) {
        const res = await api('/api/healthTick', { dm: curId, hours });
        if (res.ok && res.player) {
          curPlayer = res.player;
          renderPlayer();
          sysTip(`健康因时间流逝减少了 ${hours * 50} 点`);
        }
        curPlayer.lastHealthCheck = now;
      }
    }
  }, 60000);
}

// ============ 模态弹窗 ============
// hideOk=true 时只显示"取消"按钮（用于只读弹窗，如好友详情）
// ============ Modal 弹窗队列 ============
// 解决：多个 sys_tip（决斗邀请/对方已选/决斗结算 等）几乎同时到达时，前一个还没关就被后一个覆盖，
// 或多个 modal 同时挂在 DOM 里。改为"同一时间只弹一个，其余排队"。
const _modalQueue = [];
let _modalIsOpen = false;

function showModal(title, body, onOk, okText='确定', onCancel, hideOk=false, afterRender) {
  _modalQueue.push({ title, body, onOk, okText, onCancel, hideOk, afterRender });
  pumpModalQueue();
}

function pumpModalQueue() {
  if (_modalIsOpen) return;
  if (!_modalQueue.length) return;
  const item = _modalQueue.shift();
  _modalIsOpen = true;
  showModalNow(item);
}

function showModalNow({ title, body, onOk, okText, onCancel, hideOk, afterRender }) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;
  $("modalOk").textContent = okText;
  $("modalOk").onclick = onOk;
  $("modalOk").style.display = hideOk ? 'none' : '';
  // 取消按钮（默认行为就是 closeModal；传了 onCancel 就替换）
  const cancelBtn = $("modal").querySelector('.modal-foot button:not(.ok)');
  if (cancelBtn) {
    cancelBtn.onclick = onCancel || closeModal;
    cancelBtn.textContent = hideOk ? '关闭' : '取消';
  }
  // 队列提示：如果后面还有 N 个待弹的，在标题末尾加一个"队列 N"的角标
  if (_modalQueue.length > 0) {
    const badge = document.createElement('span');
    badge.style.cssText = 'margin-left:8px;padding:0 6px;font-size:11px;background:rgba(255,215,0,.25);color:#ffd700;border-radius:8px;';
    badge.textContent = `还有 ${_modalQueue.length} 条`;
    $("modalTitle").appendChild(badge);
  }
  $("modal").classList.add('show');
  // 关键：modal body 已渲染，立即调用 afterRender 回调（替代旧的 setTimeout 50ms）
  // 旧的 setTimeout 方式在队列模式下会"绑错按钮"（50ms 后 modal 还没渲染，body 是上一个 modal 的内容）
  if (typeof afterRender === 'function') {
    try { afterRender(); } catch (e) { console.error('afterRender failed:', e); }
  }
}

function closeModal() {
  $("modal").classList.remove('show');
  _modalIsOpen = false;
  // 80ms 后弹下一个：给浏览器时间消化关闭动画，也让用户能看清"上一个关完了"
  setTimeout(pumpModalQueue, 80);
}

// 立即清空队列（登录/切换账号时调用，避免历史 modal 残留）
function clearModalQueue() {
  _modalQueue.length = 0;
  closeModal();
}

// ============ 通用分页器（每页 20 条）============
// 用法：
//   1) 渲染时：_pagerSet(pageKey, list, item => html);  // 注册列表 + 单条渲染器
//   2) 容器：<div data-pager-key="${pageKey}">...</div>
//   3) 翻页：pagerGo(pageKey, newPage)  // 自动重渲染所有匹配的容器
const PAGE_SIZE = 20;
const _pagerState = {};   // pageKey -> list
const _pagerRender = {};  // pageKey -> item => html

function _pagerSet(pageKey, list, render) {
  _pagerState[pageKey] = list || [];
  _pagerRender[pageKey] = render;
  _pagerState[pageKey + '_page'] = 1;
}
function pagerSlice(pageKey) {
  const list = _pagerState[pageKey] || [];
  const cur = _pagerState[pageKey + '_page'] || 1;
  return list.slice((cur - 1) * PAGE_SIZE, cur * PAGE_SIZE);
}
function pagerHtml(pageKey) {
  const list = _pagerState[pageKey] || [];
  if (list.length <= PAGE_SIZE) return '';
  const cur = _pagerState[pageKey + '_page'] || 1;
  const totalPages = Math.ceil(list.length / PAGE_SIZE);
  let html = '<div style="display:flex;justify-content:center;align-items:center;gap:1.5vw;margin-top:2vw;font-size:3vw;flex-wrap:wrap;">';
  const btnDis = 'disabled style="opacity:.4;background:none;border:1px solid #555;color:#888;padding:1vw 2vw;border-radius:4px;"';
  const btnEn  = 'style="background:none;border:1px solid #888;color:#fff;padding:1vw 2vw;border-radius:4px;cursor:pointer;"';
  html += `<button onclick="pagerGo('${pageKey}', ${cur - 1})" ${cur === 1 ? btnDis : btnEn}>上一页</button>`;
  for (let p = 1; p <= totalPages; p++) {
    if (p === cur) {
      html += `<span style="padding:1vw 2.5vw;background:rgba(255,215,0,.2);color:#ffd700;border-radius:4px;">${p}</span>`;
    } else if (Math.abs(p - cur) <= 2 || p === 1 || p === totalPages) {
      html += `<button onclick="pagerGo('${pageKey}', ${p})" style="background:none;color:#fff;border:none;cursor:pointer;padding:1vw 2.5vw;">${p}</button>`;
    } else if (p === 2 || p === totalPages - 1) {
      html += '<span style="color:#888;">…</span>';
    }
  }
  html += `<button onclick="pagerGo('${pageKey}', ${cur + 1})" ${cur === totalPages ? btnDis : btnEn}>下一页</button>`;
  html += `<span style="color:rgba(255,255,255,.5);font-size:2.6vw;margin-left:1vw;">共 ${totalPages} 页 / ${list.length} 条</span>`;
  html += '</div>';
  return html;
}
function pagerGo(pageKey, page) {
  const list = _pagerState[pageKey];
  if (!list) return;
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (page < 1 || page > totalPages) return;
  _pagerState[pageKey + '_page'] = page;
  document.querySelectorAll(`[data-pager-key="${pageKey}"]`).forEach(c => {
    const slice = pagerSlice(pageKey);
    const render = _pagerRender[pageKey];
    let html = slice.map(render).join('');
    html += pagerHtml(pageKey);
    c.innerHTML = html;
  });
}

// ============ 时间格式化 ============
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ 启动 ============
loadAnnouncement();
</script>
