<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>混沌纪元</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  /* 关键：iOS Safari 必须在 html 和 body 都设置这些，否则不滚 */
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:scroll;
  -webkit-overflow-scrolling:touch;  /* iOS 必须 */
  touch-action:pan-y;                /* 移动端必须 */
  background:#000; color:#fff;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}
/* 整体可上下滑动：body 不再 fixed */
.page {
  position:relative; left:0; top:0; width:100%; min-height:100vh;
  display:flex; flex-direction:column;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
/* ===== 浮动滚动条（移动端可见可拖动）===== */
.scroll-rail {
  position:fixed; right:1.5vw; top:20vh; bottom:20vh;
  width:8px; z-index:200;
  background:rgba(255,255,255,.08); border-radius:4px;
  touch-action:none;
  /* 默认让滚动条透明不拦截，只 thumb 本身接受事件 */
  pointer-events:none;
}
.scroll-thumb {
  position:absolute; left:0; right:0; top:0; height:60px;
  background:linear-gradient(180deg,#ff7a86,#e62836); border-radius:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  transition:opacity .15s;
  pointer-events:auto;
  cursor:pointer;
}
.scroll-rail:hover .scroll-thumb { opacity:.9; }

/* ===== 启动页 ===== */
#startPage { background:url('start_bg.png') center/cover no-repeat; }
#startPage .top { width:100%; height:13vw; max-height:64px;
  background:url('start_top.png') center/cover no-repeat; flex-shrink:0; }
#startPage .body { flex:1; display:flex; flex-direction:column; align-items:center;
  padding:0 4vw 2vh; overflow:hidden; }
.start-title { margin-top:24vh; font-weight:900; letter-spacing:.3em; text-indent:.3em;
  font-size:6.8vw; color:#fff; text-shadow:0 0 14px rgba(255,50,50,.9),0 2px 6px #000; }
.start-title.glitch { position:relative; display:inline-block; }
.start-title.glitch::before,.start-title.glitch::after { content:attr(data-t);
  position:absolute; left:0; top:0; width:100%; overflow:hidden; }
.start-title.glitch::before { color:#0ff; clip-path:inset(0 0 55% 0);
  animation:g1 3.4s infinite steps(2); opacity:.5; }
.start-title.glitch::after { color:#f00; clip-path:inset(55% 0 0 0);
  animation:g2 2.9s infinite steps(2); opacity:.5; }
@keyframes g1 { 0%,92%,100%{transform:translate(0);} 94%{transform:translate(-2px,-1px);} 97%{transform:translate(2px,1px);} }
@keyframes g2 { 0%,90%,100%{transform:translate(0);} 93%{transform:translate(2px,1px);} 96%{transform:translate(-2px,-1px);} }

.input-wrap { margin-top:7vh; width:58vw; max-width:280px;
  background:rgba(255,255,255,.95); border:3px solid #e8e8e8; border-radius:999px;
  padding:2.8vw 4vw; box-shadow:0 6px 22px rgba(0,0,0,.6); }
.input-wrap input { width:100%; border:none; outline:none; background:transparent;
  font-size:4.4vw; text-align:center; letter-spacing:.25em; color:#222; }
.big-btn { margin-top:3vh; width:58vw; max-width:280px; padding:3vw 0;
  border:2px solid rgba(255,120,130,.7); border-radius:999px; cursor:pointer;
  font-size:4.4vw; font-weight:bold; letter-spacing:.4em; text-indent:.4em; color:#fff;
  background:linear-gradient(180deg,#ef2b3a,#b8121f);
  box-shadow:0 5px 18px rgba(220,20,45,.6), inset 0 1px 0 rgba(255,255,255,.35); }
.big-btn:active { transform:scale(.97); }
.hint { width:58vw; max-width:280px; margin-top:1.5vh; color:#ff5060;
  font-size:3.4vw; text-align:center; }
.notice { margin-top:auto; margin-bottom:2vh; width:86vw; max-width:460px;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); border-radius:10px;
  padding:2vh 5vw; font-size:3.6vw; line-height:1.8; text-align:center;
  white-space:pre-line; color:rgba(255,255,255,.9); }

/* ===== 大厅页 ===== */
#hallPage { background:url('hall_bg.png') center/cover no-repeat; }
.hall-top { width:100%; height:13vw; max-height:64px; flex-shrink:0;
  background:url('hall_top.png') center/cover no-repeat; position:relative; z-index:5; }
.top-btn { position:absolute; top:50%; transform:translateY(-50%);
  width:10vw; height:10vw; max-width:42px; max-height:42px;
  border:none; border-radius:50%; background:transparent; cursor:pointer; padding:1.5vw; }
.top-btn.left { left:3vw; } .top-btn.right { right:3vw; }
/* 刷新按钮：紧贴设置按钮左侧（设置按钮 right:3vw + 自身 10vw + 1vw 间距） */
.top-btn-refresh { right: calc(3vw + 10vw + 1vw); }
/* 点击时旋转一下做反馈 */
.top-btn-refresh.spinning img { animation: refreshSpin 0.7s linear; }
@keyframes refreshSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.top-btn img { width:100%; height:100%; object-fit:contain; }

/* 系统提示：双折叠（红色=系统/公告，绿色=聊天/送礼）+ 三角形箭头 */
.sysbar-wrap { margin:2vw 4vw 0; background:rgba(0,0,0,.72); border-radius:8px;
  border:1px solid rgba(255,77,90,.3); flex-shrink:0; overflow:hidden;
  position:relative; z-index:90; }
.sysbar-line { display:flex; align-items:center; cursor:pointer; user-select:none;
  overflow:hidden; padding:1.8vw 3vw; font-size:3.4vw; line-height:1.3;
  gap:2vw; }
.sysbar-line-red { color:#ff4d5a; border-bottom:1px solid rgba(255,77,90,.15); }
.sysbar-line-green { color:#2ee84e; }
.sysbar-current { flex:1; min-width:0; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sysbar-arrow { flex-shrink:0; font-size:3.2vw; color:rgba(255,255,255,.45);
  transition:transform .2s; user-select:none; }
.sysbar-line.collapsed .sysbar-arrow { transform:rotate(-90deg); }
.sysbar-list { max-height:45vh; overflow-y:auto; padding:0 4vw 2vw;
  border-top:1px dashed rgba(255,77,90,.3); }
.sysbar-list-green { border-top-color:rgba(46,232,78,.3); }
.sysbar-item { padding:1.5vw 0; color:#ff4d5a; font-size:3.2vw;
  border-bottom:1px solid rgba(255,77,90,.1); }
.sysbar-item:last-child { border-bottom:none; }
.sysbar-item .ts { color:rgba(255,255,255,.4); font-size:2.8vw; margin-right:1.5vw; }
/* 颜色分级：聊天 / 送礼用绿色（指定玩家可见）；系统默认红；管理员公告用蓝色（全员可见）*/
.sysbar-item.type-chat    { color:#2ee84e; border-bottom-color:rgba(46,232,78,.15); }
.sysbar-item.type-chat    .ts { color:rgba(46,232,78,.5); }
.sysbar-item.type-gift    { color:#2ee84e; border-bottom-color:rgba(46,232,78,.15); }
.sysbar-item.type-gift    .ts { color:rgba(46,232,78,.5); }
.sysbar-item.type-announce{ color:#4d8cff; border-bottom-color:rgba(77,140,255,.15); }
.sysbar-item.type-announce .ts { color:rgba(77,140,255,.5); }
#sysbarCurrent.type-chat     { color:#2ee84e; }
#sysbarCurrent.type-gift     { color:#2ee84e; }
#sysbarCurrent.type-announce { color:#4d8cff; }

/* 折叠区块 */
.collapse-head { display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; user-select:none; padding:1vw 0; }
.collapse-head:hover { color:#fff; }
.collapse-arrow { transition:transform .2s; color:rgba(255,255,255,.5); }
.collapse-wrap.collapsed .collapse-arrow { transform:rotate(-90deg); }
.collapse-wrap.collapsed .collapse-body { display:none; }

/* 地图（12×20 网格）*/
.map-area {
  position:relative; margin:2vw 4vw 0; flex-shrink:0;
  max-height:38vh;            /* 关键：限制地图最大高度，给 .info-panel 留足够空间 */
  overflow:hidden;             /* 防止地图内容溢出影响下层 */
}
.map-bg { width:100%; display:block; border-radius:8px; }
.map-grid { position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(20, 1fr);
  grid-template-rows:repeat(12, 1fr); }
.map-cell {
  cursor:pointer; border:1px solid transparent; transition:background .15s;
  position:relative;
  /* 关键：允许 cell 同时响应点击和翻动滚动 */
  touch-action:manipulation;
}
.map-cell:hover, .map-cell:active { background:rgba(255,77,90,.15); }
.map-cell.highlight { background:rgba(46,232,78,.25); }

/* 玩家位置圆点（CSS 绘制，不依赖图标素材）*/
.player-pin { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:auto; z-index:3; cursor:pointer; }
/* 自己的圆点：z-index 比其他玩家的 pin 高，永远在最顶端，不被任何东西盖住 */
.player-pin.pin-mine { z-index: 10; }
.player-dot { width:80%; height:80%; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:bold; font-size:3vw; line-height:1;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 2px 6px rgba(0,0,0,.55);
  transition:transform .15s; }
.player-dot:active { transform:scale(.92); }
/* 自己=红，好友=绿，陌生人（模式人）=灰；同一格子有陌生人时灰色为准 */
.player-dot.me      { background:radial-gradient(circle at 35% 30%,#ff8a96,#e62836 70%); }
.player-dot.friend  { background:radial-gradient(circle at 35% 30%,#7dfca0,#1f7a36 70%); }
.player-dot.stranger{ background:radial-gradient(circle at 35% 30%,#bcbcc4,#6a6a72 70%); opacity:.85; }
.player-dot .num { font-size:2.8vw; text-shadow:0 1px 2px rgba(0,0,0,.5); }

/* 同格玩家弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center; z-index:100; }
.modal-mask.show { display:flex; }
.modal-box { background:rgba(25,23,33,.97);
  border:2px solid #ff4d5a; border-radius:12px;
  width:90vw; max-width:480px; max-height:80vh;
  display:flex; flex-direction:column; }
.modal-title { padding:3vw; font-size:4.5vw; font-weight:bold;
  color:#ff4d5a; border-bottom:1px solid rgba(255,77,255,.15); text-align:center; }
.modal-body { padding:3vw; overflow-y:auto; flex:1; }
.modal-footer { padding:2vw 3vw 3vw; display:flex; gap:2vw; }
.modal-footer .place-btn { flex:1; }

/* 私聊窗口（浮动，可多开）*/
.chat-box { position:fixed; right:2vw; bottom:2vw; width:80vw; max-width:380px;
  height:65vh; background:rgba(20,18,28,.98); border:1px solid #2ee84e;
  border-radius:12px; display:flex; flex-direction:column;
  z-index:80; box-shadow:0 4px 20px rgba(0,0,0,.6); }
.chat-box:nth-of-type(2) { right:2vw; bottom:calc(65vh + 3vw); }
.chat-box:nth-of-type(3) { right:2vw; bottom:calc(130vh + 4vw); }
.chat-head { padding:2.5vw 3vw; background:rgba(46,232,78,.1);
  border-bottom:1px solid rgba(46,232,78,.2);
  display:flex; justify-content:space-between; align-items:center;
  font-size:3.4vw; color:#fff; }
.chat-close { font-size:5vw; color:rgba(255,255,255,.5); cursor:pointer;
  padding:0 1.5vw; line-height:1; }
.chat-close:hover { color:#fff; }
.chat-msgs { flex:1; overflow-y:auto; padding:2vw 3vw; }
.chat-msg { margin-bottom:2vw; display:flex; flex-direction:column; }
.chat-msg.mine { align-items:flex-end; }
.chat-msg.theirs { align-items:flex-start; }
.chat-bubble { padding:1.5vw 2.5vw; border-radius:8px; max-width:70%;
  font-size:3.4vw; line-height:1.5; word-break:break-word; }
.chat-msg.mine .chat-bubble { background:linear-gradient(180deg,#34d058,#1f7a36); color:#fff; }
.chat-msg.theirs .chat-bubble { background:rgba(255,255,255,.1); color:#fff; }
.chat-time { font-size:2.4vw; color:rgba(255,255,255,.3); margin-top:.5vw; }
.chat-input-row { display:flex; gap:1.5vw; padding:2vw; border-top:1px solid rgba(255,255,255,.1); }
.chat-input-row input { flex:1; padding:1.5vw 2vw; background:#222; color:#fff;
  border:1px solid rgba(255,255,255,.15); border-radius:6px; font-size:3.2vw; }
.chat-input-row button { padding:1.5vw 3vw; background:linear-gradient(180deg,#34d058,#1f7a36);
  color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:3.2vw; cursor:pointer; }

/* Tab */
.tab-bar { position:relative; display:flex; margin:3vw 4vw 0; flex-shrink:0; }
.tab { flex:1; padding:2vw 0; text-align:center; font-size:4vw;
  font-weight:bold; color:rgba(255,255,255,.65); cursor:pointer; }
.tab.active { color:#fff; }
.tab { position:relative; }
.tab .req-badge { position:absolute; top:0.5vw; right:14%; background:#ff4d5a; color:#fff;
  font-size:2.4vw; min-width:4.2vw; height:4.2vw; line-height:4.2vw; padding:0 1.2vw;
  border-radius:50%; font-weight:bold; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.tab-indicator { position:absolute; bottom:-1vw; left:0;
  width:25%; height:0.8vw; background:#ff4d5a; border-radius:999px;
  transition:left .3s; }

/* 系统提示：不滚动，溢出 ellipsis 截断（玩家可点开"展开历史"看完整内容） */
.sysbar-current.marquee {
  display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* 信息面板 */
.info-panel {
  flex:1; min-height:30vh;           /* 关键：保证至少有 30vh 高度，让用户能滑 */
  margin:2vw 4vw; background:rgba(25,23,33,.92);
  border-radius:12px; border:1px solid #2e2938; padding:3vw;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }

/* 个人信息 */
.profile-top { display:flex; gap:3vw; padding-bottom:2vw;
  border-bottom:1px solid rgba(255,77,90,.3); }
.avatar-area { display:flex; flex-direction:column; align-items:center; gap:1vw;
  flex-shrink:0; }
.avatar { width:22vw; height:22vw; max-width:90px; max-height:90px;
  background:#fff; border-radius:4px; object-fit:cover; visibility:hidden; }
.player-name { color:#ff4d5a; font-size:3.5vw; font-weight:bold; }
.player-id-row { display:flex; align-items:center; gap:1.5vw; font-size:3vw; color:rgba(255,255,255,.7); }
.hide-id-icon { width:4vw; max-width:16px; cursor:pointer; }
.attrs-cols { flex:1; display:grid; grid-template-columns:1fr 1fr;
  gap:1.2vw 2.4vw; font-size:3.4vw; }
.attrs-cols > div { display:flex; align-items:center; gap:1vw; color:rgba(255,255,255,.85); min-width:0; }
.attrs-cols .attr-label { color:rgba(255,255,255,.55); flex-shrink:0; white-space:nowrap; }
.attrs-cols .attr-value { background:rgba(255,255,255,.1); border-radius:4px;
  padding:0.8vw 1.5vw; flex:1; min-width:0; min-height:5vw;
  text-align:center; color:#fff; font-weight:bold; }

.profile-bottom { display:grid; grid-template-columns:1fr 1fr; gap:2vw;
  margin-top:3vw; padding-bottom:0; position:relative; }
.action-btn { position:relative; border:none; background:transparent;
  cursor:pointer; padding:0; height:11vw; max-height:46px; }
.action-btn .btn-bg-img { width:100%; height:100%; display:block; }
.action-btn .btn-text { position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%); color:#fff; font-size:4vw;
  font-weight:bold; letter-spacing:.1em; pointer-events:none; }

/* 骰子按钮（位于头像区 ID 下方）*/
.dice-btn-avatar { width:16vw; height:16vw; max-width:64px; max-height:64px;
  border:none; background:transparent; cursor:pointer; padding:0;
  margin-top:2vw; }
.dice-btn-avatar img { width:100%; height:100%; }

/* ID 隐藏眼睛 */
.id-visible, .id-hidden { font-family:monospace; }
.id-hidden { letter-spacing:0.15em; color:#0ff; }

/* 骰子菜单 */
.dice-menu { position:absolute; bottom:24vw; left:50%;
  transform:translateX(-50%); background:rgba(25,23,33,.95);
  border:1px solid #ff4d5a; border-radius:12px; padding:2vw;
  display:flex; gap:2vw; z-index:20; }
.dice-option { background:rgba(255,77,90,.2); border:1px solid #ff4d5a;
  border-radius:8px; color:#fff; padding:2vw 4vw; font-size:4vw;
  font-weight:bold; cursor:pointer; }
.dice-option:active { background:rgba(255,77,90,.4); }

/* 帖子列表 */
.posts-list { display:flex; flex-direction:column; gap:2vw; }
.post-item { background:rgba(255,255,255,.05); padding:3vw;
  border-radius:8px; cursor:pointer; border-left:3px solid #ff4d5a; }
.post-title { font-size:4vw; font-weight:bold; color:#fff; }
.post-meta { font-size:3vw; color:rgba(255,255,255,.5); margin-top:1vw; }
.post-bounty { display:flex; justify-content:space-between; align-items:center;
  margin-top:1.5vw; font-size:3.2vw; padding:1vw 0; }
.claim-btn { padding:1vw 3vw; background:linear-gradient(180deg,#ffd700,#c8a300);
  color:#000; border:none; border-radius:6px; font-size:3vw; font-weight:bold; cursor:pointer; }
.claim-btn:active { transform:scale(.95); }
.post-content { margin-top:1.5vw; font-size:3.2vw; color:rgba(255,255,255,.7); line-height:1.6;
  white-space:pre-wrap; max-height:30vw; overflow-y:auto; }

/* 商城 */
.shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:3vw; }
.shop-item { background:rgba(255,255,255,.08); padding:3vw;
  border-radius:8px; text-align:center; cursor:pointer; }
.shop-icon { font-size:4vw; margin-bottom:1vw; width:4vw;height:4vw;margin:0 auto 1vw;display:flex;align-items:center;justify-content:center;overflow:hidden; }
.shop-icon img { width:4vw;height:4vw;object-fit:contain; }
.shop-icon span { font-size:4vw; line-height:1; }
.shop-name { font-size:3.6vw; font-weight:bold; }
.shop-price { font-size:3.2vw; color:#ffd700; margin-top:1vw; }

/* 公告 */
.ann-content { color:rgba(255,255,255,.9); font-size:3.6vw; line-height:1.8; }
.ann-content img { max-width:100%; border-radius:4px; }

/* 通用 */
.footer-mark { margin-top:auto; text-align:center; color:rgba(255,255,255,.3);
  letter-spacing:.35em; font-size:3.4vw; padding:1.5vh 0; font-weight:bold; }
.empty { text-align:center; padding:6vw 0; color:rgba(255,255,255,.4); font-size:3.6vw; }
.back-btn { display:block; margin:4vw auto 0; padding:2.5vw 6vw;
  background:rgba(255,77,90,.2); border:1px solid #ff4d5a;
  border-radius:999px; color:#fff; font-size:3.6vw; font-weight:bold; }

/* 区域信息面板 */
.place-info { display:flex; flex-direction:column; gap:2vw;
  border:2px solid #ff4d5a; border-radius:12px; padding:3vw; }
.place-image { width:100%; border-radius:6px; overflow:hidden; background:rgba(0,0,0,.3);
  display:flex; align-items:center; justify-content:center; min-height:30vw; }
.place-image img { max-width:100%; max-height:50vw; object-fit:contain; }
.place-image.placeholder { color:rgba(255,255,255,.4); font-size:3.4vw;
  border:1px dashed rgba(255,255,255,.2); background:rgba(255,255,255,.03); }
.place-name { font-size:5vw; font-weight:bold; color:#ff4d5a;
  text-align:center; padding:2vw 0; }
.place-desc { font-size:3.4vw; color:rgba(255,255,255,.7); line-height:1.6; }
.place-content { font-size:3.4vw; color:rgba(255,255,255,.85); line-height:1.8;
  background:rgba(255,255,255,.05); padding:2.5vw; border-radius:6px; }
.place-content img { max-width:100%; border-radius:4px; }
.place-buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2vw;
  margin-top:3vw; }
.place-btn { background:linear-gradient(180deg,#ef2b3a,#b8121f); color:#fff;
  border:none; border-radius:8px; padding:3vw 0; font-size:3.4vw;
  font-weight:bold; cursor:pointer; box-shadow:0 3px 8px rgba(220,20,45,.4); }
.place-btn:active { transform:scale(.97); }
.place-btn.back { background:rgba(255,255,255,.15); color:#fff;
  border:1px solid rgba(255,255,255,.3); }

/* 前往确认弹窗 */
.travel-modal { text-align:center; }

<script>
// ============ 浮动滚动条（移动端拖动/点击都能滚）============
(function initScrollRail() {
  const rail = $('scrollRail');
  const thumb = $('scrollThumb');
  if (!rail || !thumb) return;

  let railH = 0, thumbH = 60, docH = 0, viewH = 0;
  const refresh = () => {
    docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, 1);
    viewH = window.innerHeight;
    railH = rail.clientHeight;
    thumbH = Math.max(40, Math.min(railH * (viewH / docH), railH));
    thumb.style.height = thumbH + 'px';
    sync();
  };
  const sync = () => {
    const max = docH - viewH;
    const ratio = (window.scrollY || document.documentElement.scrollTop || 0) / Math.max(max, 1);
    thumb.style.transform = `translateY(${ratio * (railH - thumbH)}px)`;
  };
  window.addEventListener('scroll', sync, { passive: true });
  window.addEventListener('resize', refresh);
  setTimeout(refresh, 100);
  setTimeout(refresh, 500);
  // 拖动 thumb
  let dragging = false, startY = 0, startScroll = 0;
  const onDown = (clientY) => {
    dragging = true;
    const rect = thumb.getBoundingClientRect();
    startY = clientY;
    startScroll = window.scrollY || document.documentElement.scrollTop || 0;
    // 判断是点 thumb 还是点 rail
    if (clientY < rect.top || clientY > rect.bottom) {
      // 点 rail → 跳到对应位置
      const ratio = (clientY - rail.getBoundingClientRect().top - thumbH/2) / (railH - thumbH);
      const max = docH - viewH;
      const target = Math.max(0, Math.min(max, ratio * max));
      window.scrollTo({ top: target, behavior: 'smooth' });
    }
  };
  const onMove = (clientY) => {
    if (!dragging) return;
    const dy = clientY - startY;
    const max = docH - viewH;
    const ratio = (startScroll + dy) / Math.max(max, 1);
    const target = Math.max(0, Math.min(max, ratio * max));
    window.scrollTo(0, target);
  };
  const onUp = () => { dragging = false; };

  rail.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0].clientY); }, { passive: false });
  rail.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientY); }, { passive: false });
  rail.addEventListener('touchend', onUp);
  rail.addEventListener('mousedown', e => { onDown(e.clientY); });
  document.addEventListener('mousemove', e => { onMove(e.clientY); });
  document.addEventListener('mouseup', onUp);

  // 页面内容变化时刷新滚动条高度
  setInterval(refresh, 2000);
})();
</script>

<script>
// ============ 配置 ============
const API_BASE = 'https://hundun-d0g97wc3v815cd196-1497599973.ap-shanghai.app.tcloudbase.com';
const NOTICE_DEFAULT = "欢迎进入《混沌纪元》沙盒世界！\n请输入您的专属ID进入系统。\n本游戏纯属原创虚构切勿较真，祝冒险愉快！";

// ============ 状态 ============
let curId = null, curPlayer = null, curTab = 'profile';
let PLACES = [];
let idVisible = true;
let curCell = null;  // 玩家当前所在格子
let curViewPlace = null;  // 当前查看的地图对象
const sysTips = [];  // 服务器系统提示（顶部滚动条始终显示最新一条）
const localTips = [];  // 本地操作产生的提示（只进历史列表，不顶滚动条）

// ============ 工具 ============
const $ = id => document.getElementById(id);

function toast(msg, type='ok', duration = 2000) {
  const t = $("toast");
  t.textContent = msg;
  t.className = 'toast show ' + type;
  if (t._timer) clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', duration);
}

async function api(path, body) {
  const opts = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(API_BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 把 HTTP 状态透传到 console，便于排查 401/404/500
      console.warn('[api] 非 2xx:', res.status, path, data);
      // 优先提取 CloudBase 错误消息（data.message），其次 data.error，最后 HTTP 状态
      const errMsg = data.message || data.error || `HTTP ${res.status}`;
      // 把余额不足/服务不可用 这种后端服务问题直接展示，避免误以为是网络错误
      return { error: errMsg, status: res.status, code: data.code };
    }
    return data;
  } catch (e) {
    return { error: '网络错误（请检查网络或后端部署）' };
  }
}

// 本地操作产生的提示：写入本地历史 + 强制刷新顶部滚动条
// type: 'system'（默认红）/ 'chat' 或 'gift'（绿）/ 'announce'（蓝）
// 同内容提示只保留最新一条（"顶替旧消息"），避免堆栈轰炸
function sysTip(msg, type = 'system') {
  const ts = Math.floor(Date.now() / 1000);
  // 删掉历史中相同文本的（保留 ts 最新那条）
  for (let i = localTips.length - 1; i >= 0; i--) {
    if (localTips[i].msg === msg && localTips[i].type === type) localTips.splice(i, 1);
  }
  localTips.unshift({ time: fmtTimeFull(ts), msg, ts, type, _local: true });
  if (localTips.length > 300) localTips.length = 300;
  renderSysbarLists();
  refreshSysbarRows();
}

// 顶部两横统一刷新（从 sysTips + localTips 合并，分别取红/绿最新一条）
function refreshTopbarFromAllTips() {
  refreshSysbarRows();
}

// 设置顶部单行文字：不滚动，溢出 ellipsis 截断（玩家点"展开历史"看完整内容）
function setSysbarLine(el, text, type) {
  if (!el) return;
  el.textContent = text;
  el.classList.remove('marquee', 'type-chat', 'type-gift', 'type-announce');
  if (type === 'chat' || type === 'gift' || type === 'announce') el.classList.add('type-' + type);
}

// 顶部两横独立刷新：红一行（system/announce 全服广播）+ 绿一行（chat/gift 私人消息）
// 两行互不挤占，新消息会替换各自类型的最新一条
function refreshSysbarRows() {
  const merged = [...sysTips, ...localTips].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  // 红行：最新 type=system/announce
  const redTop = merged.find(t => t.type === 'system' || t.type === 'announce' || !t.type);
  if (redTop) {
    const prefix = redTop.type === 'announce' ? '' : '系统提示：';
    setSysbarLine($("sysbarCurrentRed"), prefix + redTop.msg, redTop.type);
  } else {
    setSysbarLine($("sysbarCurrentRed"), '系统提示：暂无', 'system');
  }
  // 绿行：最新 type=chat/gift
  const greenTop = merged.find(t => t.type === 'chat' || t.type === 'gift');
  if (greenTop) {
    setSysbarLine($("sysbarCurrentGreen"), greenTop.msg, greenTop.type);
  } else {
    setSysbarLine($("sysbarCurrentGreen"), '暂无私人消息', 'chat');
  }
}

// 保留旧 API 兼容（部分代码可能仍调 updateSysbarCurrent）
function updateSysbarCurrent(text, type) {
  // 兼容旧调用：统一写到红色行
  setSysbarLine($("sysbarCurrentRed"), text, type);
}

function renderSysbarLists() {
  // 合并并按类型分桶：红色 = system + announce；绿色 = chat + gift
  const merged = [...sysTips, ...localTips].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const redList = merged.filter(t => !t.type || t.type === 'system' || t.type === 'announce');
  const greenList = merged.filter(t => t.type === 'chat' || t.type === 'gift');
  const fmtRow = (t) => `<div class="sysbar-item type-${escapeHtml(t.type||'system')}"><span class="ts">${t.time}</span>${escapeHtml(t.msg)}</div>`;
  $("sysbarListRed").innerHTML = redList.map(fmtRow).join('') || '<div style="color:rgba(255,255,255,.35);padding:2vw 0;font-size:2.8vw;">暂无</div>';
  $("sysbarListGreen").innerHTML = greenList.map(fmtRow).join('') || '<div style="color:rgba(255,255,255,.35);padding:2vw 0;font-size:2.8vw;">暂无</div>';
}

function toggleSysbarRed() {
  const line = $("sysbarCurrentRed").parentElement;

let _prevIncomingCount = 0;
let _firstBadgeLoad = true;
let _modalShowingIncoming = false;  // 防重复弹窗
async function pullFriendRequestBadge() {
  if (!curId) return;
  const res = await api('/api/friendRequests?id=' + encodeURIComponent(curId));
  const incoming = (res.ok && res.incoming) ? res.incoming : [];
  const n = incoming.length;
  window._friendReqCount = n;
  const tab = document.querySelector('.tab[data-tab="friends"]');
  if (tab) {
    let badge = tab.querySelector('.req-badge');
    if (n > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'req-badge';
        tab.appendChild(badge);
      }
      badge.textContent = n;
    } else if (badge) {
      badge.remove();
    }
  }
  // 新申请到达：弹模态框让用户立即处理
  if (!_firstBadgeLoad && n > _prevIncomingCount && !_modalShowingIncoming) {
    _modalShowingIncoming = true;
    showIncomingRequestModal(incoming[0], () => {
      _modalShowingIncoming = false;
      pullFriendRequestBadge();  // 处理完后立刻刷新红点

  _firstBadgeLoad = false;
}

// 拉全服系统提示（增量拉取：首次 300 条，之后只拉 since 之上的新内容）
// 顶部滚动条（未折叠）始终显示服务器最新一条 tip —— 即"大喇叭"
const SYS_TIPS_CACHE_MAX = 300;  // 前端缓存上限（后端同步）
let _lastSysTipTs = 0;
let _sysTipsFirstLoad = true;
// 类型优先级（数字越小越靠前）：绿色（chat/gift） > 蓝色（announce） > 红色（system）
const _TIP_TYPE_RANK = { gift: 0, chat: 0, announce: 1, system: 2 };

async function pullSysTips() {
  if (!curId) return;
  const url = _sysTipsFirstLoad
    ? `/api/sysTips?id=${encodeURIComponent(curId)}`
    : `/api/sysTips?id=${encodeURIComponent(curId)}&since=${_lastSysTipTs}`;
  const res = await api(url);
  if (!res.ok || !res.tips) {
    _sysTipsFirstLoad = false;
    return;
  }
  // 已有 _id 集合（用 _id 做去重，简单可靠）
  const existingIds = new Set(sysTips.map(t => t._id).filter(Boolean));
  for (const t of res.tips) {
    if (t._id && existingIds.has(t._id)) continue;  // 去重
    // "顶替旧消息"：服务端来的 tip，如果本端缓存中有同 type+同 msg 的旧 tip，删旧留新
    // 避免重复触发同一动作时，列表里堆出 N 条一样的记录
    for (let i = sysTips.length - 1; i >= 0; i--) {
      if (sysTips[i].msg === t.msg && sysTips[i].type === (t.type || 'system')) {
        sysTips.splice(i, 1);
      }
    }
    // chat / gift / announce 类型的 msg 已经带了【发送方名】/原始内容，直接显示；其他类型按原逻辑加【】前缀
    const isPersonal = t.type === 'chat' || t.type === 'gift' || t.type === 'announce';
    sysTips.push({
      time: fmtTimeFull(t.created_at),
      msg: isPersonal
        ? t.msg
        : `${(t.player_name && t.player_id !== 'anon')
              ? '【' + t.player_name + '】'
              : '【系统】'} ${t.msg}`,
      type: t.type || 'system',
      _id: t._id,
      created_at: t.created_at,
      isGlobal: true,
      ts: t.created_at,
      meta: t.meta || null,
    });
    if (t.created_at > _lastSysTipTs) _lastSysTipTs = t.created_at;
    // 触发决斗相关事件（去重）
    // 关键修复：首次加载（拉历史 30 条）时不要触发事件弹窗，只在增量拉取时才触发
    // 否则历史 N 条决斗结算会一个个全部弹出来轰炸用户
    if (!_sysTipsFirstLoad && t.meta && t.meta.type && typeof window._handleDuelMeta === 'function') {
      window._handleDuelMeta(t.meta, t);
    }
  }
  _sysTipsFirstLoad = false;
  // 主数组按时间倒序（顶部滚动条取最新一条）
  sysTips.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (sysTips.length > SYS_TIPS_CACHE_MAX) sysTips.length = SYS_TIPS_CACHE_MAX;
  renderSysbarLists();
  // 关键：永远显示 sysTips + localTips 中的最新一条（不再卡旧 tip）
  refreshSysbarRows();
}

// 时间戳 → HH:MM:SS（兼容秒/毫秒）
function fmtTimeFull(ts) {
  if (!ts) return '--:--:--';
  const ms = ts < 1e12 ? ts * 1000 : ts;  // < 1e12 视为秒级
  const d = new Date(ms);
  if (isNaN(d.getTime())) return '--:--:--';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// 智能返回键：左上报错键优先做"返回上一级"（关 modal / 退回 profile），最后才退出登录
function backOrLogout() {
  // 1. 任何 modal 打开（含 travelModal）→ 关 modal
  if ($("modal").classList.contains('show')) {
    closeModal();
    return;
  }
  if ($("travelModal").classList.contains('show')) {
    closeTravelModal();
    return;
  }
  // 2. placeInfo 详情打开 → 关闭 + 切回 profile tab（避免留空白）
  const placeInfo = $("placeInfo");
  if (placeInfo && placeInfo.style.display === 'block') {
    hidePlaceInfo();
    switchTab('profile');
    return;
  }
  // 3. 任何子内容 panel 打开（inventory/skills/friends 等）→ 退回 profile
  //    —— 仍然保持 profile tab 的高亮和 indicator 位置（这些 modal tab 不在 tab bar 上）
  const visibleSubPanel = ['inventory', 'skills', 'friends'].some(t => {
    const el = $("content-" + t);
    return el && el.style.display === 'block';
  });
  if (visibleSubPanel) {
    switchTab('profile');
    return;
  }
  // 4. 当前在某个非 profile 的"顶层 tab"（posts/shop/announce）→ 回 profile
  if (curTab && ['posts', 'shop', 'announce'].includes(curTab)) {
    switchTab('profile');
    return;
  }
  // 5. 走到这里才真正退出登录
  logout();
}

async function renderPlayer() {

  const p = curPlayer;

  idEl.textContent = idVisible ? curId : '*****';
  idEl.classList.toggle('id-hidden', !idVisible);
  if (p.avatar) { $("avatarImg").src = p.avatar; $("avatarImg").style.visibility = 'visible'; }
  const attrs = ['sect','lv','stock','health','gold','debt','spirit','sense','body','agile','charm','blood','wisdom'];
  // 属性名称按类型上色：精神/感知/体魄/敏捷/魅力/血脉/悟性 → 绿色；蓝条 → 蓝色；玄币 → 金色
  const COLOR_MAP = {
    green: ['spirit','sense','body','agile','charm','blood','wisdom'],
    blue:  ['stock'],
    gold:  ['gold'],
  };
  const colorOf = (a) => {
    if (COLOR_MAP.green.includes(a)) return '#2ee84e';
    if (COLOR_MAP.blue.includes(a))  return '#4d8cff';
    if (COLOR_MAP.gold.includes(a))  return '#ffd700';
    return 'rgba(255,255,255,.55)';  // 其他属性默认浅灰
  };
  attrs.forEach(a => {
    const el = $("attr-" + a);
    if (el) {
      el.textContent = p[a] !== undefined ? p[a] : '--';
      el.style.color = colorOf(a);
    }
  });
  // 注意：stock 和 spirit 是两个独立字段，分别由上面的循环渲染到 attr-stock 和 attr-spirit
  // （不要在��里再做 spirit→stock 覆盖，否则会让两个面板显示同一个值，看起来像"联动"）
}

function buildGrid() {
  const grid = $("mapGrid");

      const cell = document.createElement('div');
      cell.className = 'map-cell';

      grid.appendChild(cell);
    }
  }

// 在地图上画所有在线玩家圆点（CSS 绘制：自己=红 / 好友=绿 / 非好友=灰 / 多人显数量）
// 关键：按 cell 独立渲染 —— 每个 cell 只显示"实际在这个 cell 上"的玩家，
// 同一个 place 的不同 cell 之间互不传染。
// 所有"身份识别"都用 UID（玩家身份证）；DM/姓名改变不影响识别。
async function highlightPlaces() {
  document.querySelectorAll('.map-cell').forEach(c => {
    c.classList.remove('highlight');
    const old = c.querySelector('.player-pin');
    if (old) old.remove();
  });
  if (!PLACES || !PLACES.length) return;

  // 确保好友集合已就绪（按 UID 拉；改 DM/姓名不影响）
  if (!window._friendIds || window._friendIds.size === 0) {
    try { await loadFriendIds(); } catch (e) {}
  }

  const myPlaceId = curPlayer && curPlayer.place_id != null ? String(curPlayer.place_id).trim() : '';
  // 自己所在 cell：优先取 curPlayer.current_cell（从后端文档读，最权威 —— "玩家真正在哪个格子"），
  // fallback 顺序：
  //   1) curPlayer.current_cell （最权威，玩家真正所在的格子）
  //   2) 后端 places 里 myPlaceId 对应的第一个 cell（兜底：改 DM 后 current_cell 没被复制）
  //   3) ⚠️ 不再用全局 curCell —— 那是"用户点击的 cell"，不是玩家所在的 cell，会导致红点漂移
  let myCell = '';
  if (curPlayer && curPlayer.current_cell) myCell = String(curPlayer.current_cell);
  if (!myCell) {
    const myPlace = myPlaceId ? PLACES.find(p => String(p.id) === myPlaceId) : null;
    if (myPlace && myPlace.cell) myCell = Array.isArray(myPlace.cell) ? myPlace.cell[0] : myPlace.cell;
  }

  const myUid = curPlayer && curPlayer.uid;

  PLACES.forEach(p => {
    // 兼容 cell 字符串或数组
    const pCells = Array.isArray(p.cell) ? p.cell : (p.cell ? [p.cell] : []);
    if (!pCells.length) return;

    // 按 cell 分桶：每个 cell 上"实际在这个 cell 上"的玩家列表
    const listByCell = {};
    pCells.forEach(c => { listByCell[c] = []; });

    // 收集该 place 所有在线玩家（包括自己 —— 自己可能因为 last_seen 边界漏在 places.playersAt 中）
    const allAt = [];
    (p.playersAt || []).forEach(pp => {
      if (!pp.uid) return;  // 没 uid 的脏数据忽略
      allAt.push(pp);
    });

    // 关键修复：places 接口若漏返回"自己"，强制补一次 curPlayer 数据（保证红点一定画）
    if (myUid && p.id === myPlaceId && myCell && pCells.includes(myCell)) {
      if (!allAt.some(pp => pp.uid === myUid)) {
        allAt.push({ uid: myUid, name: curPlayer.name || '', cell: myCell, _self: true });
      }
    }

    // 按 cell 分桶（按玩家自己的 cell 字段）
    allAt.forEach(pp => {
      const c = (pp.cell || '').toString().toUpperCase();
      if (c && listByCell[c]) {
        listByCell[c].push(pp);
      } else if (c && !listByCell[c]) {
        // cell 不在合法 cell 列表（如管理员改 place.cell）：归入第一个合法 cell（保证至少画一个点）
        const first = pCells[0] || '';
        if (first) listByCell[first].push(pp);
      } else if (!c && p.id === myPlaceId && myCell && pCells.includes(myCell)) {
        // 缺 cell（老数据），按 place 归属自己 cell
        listByCell[myCell].push(pp);
      } else if (!c && p.id !== myPlaceId) {
        // 缺 cell 且不在自己 place：归入第一个合法 cell（让别的玩家也能看到这个点）
        const first = pCells[0] || '';
        if (first) listByCell[first].push(pp);
      }
    });

    // 过滤掉自己所在 place 的所有玩家中，自己不出现的 cell 上的"幽灵"数据（防御性）
    // 如果整个 place 没人，且这里也不是我的 cell → 跳过
    const totalHere = Object.values(listByCell).reduce((s, arr) => s + arr.length, 0);
    if (totalHere === 0 && (!myCell || !pCells.includes(myCell))) return;

    // 只在玩家实际点击/进入的那个 cell 上画自己的标点；
    // 其他 cell 只画该 cell 上真正有其他在线玩家的标点
    const drawOn = (cellKey, isMinePin) => {
      const cell = document.querySelector(`.map-cell[data-cell="${cellKey}"]`);
      if (!cell) return;
      const cellList = listByCell[cellKey] || [];
      // 过滤掉自己（用 uid 判），避免影响"是否全是好友"（自己不可能是别人的好友）
      const others = myUid ? cellList.filter(pp => pp.uid !== myUid) : cellList;
      const cellCount = cellList.length;   // 总人数（含自己）→ 用于显示数字
      const isMine = myCell === cellKey;

      cell.classList.add('highlight');

      // 没人 + 不是自己的格子 → 不画标点
      if (cellCount === 0 && !isMine) return;

      const pin = document.createElement('div');
      pin.className = 'player-pin' + (isMinePin ? ' pin-mine' : '');

      // 颜色规则：
      //   - 自己（isMine）→ 红
      //   - 他人格子：
      //     * 全是好友（按 uid 判）→ 绿
      //     * 含非好友（陌生人）→ 灰
      let dotCls;
      if (isMine) {
        dotCls = 'me';
      } else {
        const allFriends = others.length > 0 && others.every(pp => (window._friendIds || new Set()).has(pp.uid));
        dotCls = allFriends ? 'friend' : 'stranger';
      }

      const dot = document.createElement('div');
      dot.className = 'player-dot ' + dotCls;
      // 多人重叠：数字 = cell 上总玩家数
      if (cellCount > 1) {
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = cellCount;
        dot.appendChild(num);
      }
      pin.appendChild(dot);

      // 把数据挂到 pin 上，方便点 cell 时取出来
      pin.dataset.placeId = p.id;
      pin.dataset.placeName = p.name || '';
      pin.dataset.cellKey = cellKey;
      pin.addEventListener('click', e => {
        e.stopPropagation();
        onPinClick(p, cellKey);
      });

      cell.appendChild(pin);
    };

    // 1. 自己的格子：玩家实际所在的 cell 才画自己（如果有 myCell）
    if (myCell && pCells.includes(myCell)) {
      drawOn(myCell, true);  // 自己的 pin 加 .pin-mine 类，确保永远在最顶端
    }
    // 2. 同一 place 下的其他 cell：只有该 cell 真正有其他在线玩家时才画
    pCells.forEach(cellKey => {
      if (cellKey === myCell) return; // 已处理
      const cellList = listByCell[cellKey] || [];
      const others = myUid ? cellList.filter(pp => pp.uid !== myUid) : cellList;
      if (others.length > 0) drawOn(cellKey, false);
    });
  });
}

function findCellPlayers(cellKey) {

  const place = PLACES.find(p => {
    const pcells = Array.isArray(p.cell) ? p.cell : (p.cell ? [p.cell] : []);
    return pcells.includes(cellKey) && (p.playersAt || []).length > 0;

// 实际执行 travel（多 cell place：必须把玩家点进的那个具体 cell 告诉后端）
async function doTravel(place, price) {
  const placeCells = Array.isArray(place.cell) ? place.cell : (place.cell ? [place.cell] : []);
  // 优先用 curCell（onPinClick 已经同步），但要校验它属于这个 place —— 否则 fallback 到第一个 cell
  let cellKey = '';
  if (curCell && placeCells.includes(curCell)) cellKey = curCell;
  else cellKey = placeCells[0] || '';
  // 同步 curCell（避免后续操作拿旧值）
  if (cellKey) curCell = cellKey;
  const res = await api('/api/travel', { dm: curId, placeId: place.id, cell: cellKey });
  if (res.error) return toast(res.error, 'err');
  curPlayer = res.player;
  if (res.cell) curCell = res.cell;
  renderPlayer();
  highlightMyPlace();
  sysTip(`已抵达 ${place.name}`);
  backToProfile();
}

// ============ Tab 切换 ============
// 每次点 tab 都重新加载对应数据（点同一个 tab 也算重新加载，符合"随时保持更新"）
function switchTab(tab) {
  // 数据设置面板对世界频道 / 特殊商场 / 官方公告的关闭拦截
  if (tab === 'posts'    && !GAME_CONFIG.world_channel_enabled)  return sysTip('系统调整中',         'chat');
  if (tab === 'shop'     && !GAME_CONFIG.special_mall_enabled)   return sysTip('系统调整中',         'chat');
  if (tab === 'announce' && !GAME_CONFIG.announcement_enabled)   return sysTip('系统调整中',         'chat');

  const isSameTab = curTab === tab;
  curTab = tab;
  // 任何 tab 切换都先关掉 placeInfo（避免盖在新 tab 上）
  hidePlaceInfo();
  // 只对"在 tab bar 上"的 tab（profile/posts/shop/announce���才动 active 高亮和 indicator
  // —— inventory/skills/friends 是 modal 类型 tab（不在 bar 上），不能动 indicator，否则红色线跑出屏幕
  const tabs = document.querySelectorAll('.tab');
  const idx = Array.from(tabs).findIndex(t => t.dataset.tab === tab);
  if (idx >= 0) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    $("tabIndicator").style.left = (idx * 25) + '%';
  }
  // 显示对应内容（其他 tab 全部隐藏）
  hideAllContentPanels();
  $("content-" + tab).style.display = 'block';
  // 每次都重新加载（去掉 isSameTab 短路）
  if (tab === 'profile') { renderPlayer(); if (!isSameTab) loadMap(); }
  else if (tab === 'posts') loadPosts();
  else if (tab === 'shop') loadShop();
  else if (tab === 'announce') loadAnnouncementDetail();
  else if (tab === 'friends') showFriends();  // 切到好友 tab 立刻刷新申请/列表
}

// 5 个分区
const POST_AREA_BUCKETS = [
  { key: 'pinned',  cn: '📌 置顶区', color: '#ffd700' },
  { key: 'bounty',  cn: '🎯 悬赏区', color: '#ff8c00' },
  { key: 'special', cn: '✨ 特殊区', color: '#c084fc' },
  { key: 'general', cn: '📋 常规区', color: '#4d8cff' },
  { key: 'chat',    cn: '💬 闲聊区', color: '#2ee84e' },
];

// 渲染单条帖子（提取出来独立函数，便于复用）
function renderPostCard(p) {
  const claimers = Array.isArray(p.claimers) ? p.claimers : [];
  const myClaim = claimers.find(cl => cl.player_id === curId);
  const completedCount = claimers.filter(cl => cl.status === 'completed').length;
  const maxN = p.max_claim_count || 1;
  const myFailed = myClaim && myClaim.status === 'failed';
  const canClaim = p.claimable !== false
    && p.status === 'open'
    && p.author_id !== curId && !myClaim && completedCount < maxN;
  const pinnedMark = (p.pin_order && p.pin_order > 0) ? '<span style="color:#ffd700;font-size:2.6vw;">📌 置顶</span>' : '';
  // 图片固定 4:3 横版长方形（object-fit:cover 强制裁剪填充）
  const imageHtml = p.image
    ? `<div style="width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:8px;margin-bottom:2vw;"><img src="${escapeHtml(p.image)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>`
    : '';
  const claimersHtml = claimers.length
    ? `<div style="margin-top:1.5vw;background:rgba(0,0,0,.3);padding:1.5vw;border-radius:4px;">
        <div style="font-size:2.8vw;color:rgba(255,255,255,.5);margin-bottom:.5vw;">接悬赏玩家（${completedCount}/${maxN} 已完成）：</div>
        ${claimers.map(cl => `<div style="font-size:2.8vw;color:rgba(255,255,255,.7);">
          · ${escapeHtml(cl.name)} ${cl.status === 'completed' ? '<span style="color:#2ee84e;">✓已完成</span>' : cl.status === 'failed' ? '<span style="color:#ff4d5a;">✗失败</span>' : '<span style="color:#ffd700;">⏳进行中</span>'}
        </div>`).join('')}
      </div>`
    : '';
  // 作者专属管理按钮（按用户要求：去掉"编辑"，只保留 删除 和 上架/下架）
  const isMine = p.author_id === curId;
  const myBtns = isMine ? `
    <div style="margin-top:1.5vw;padding-top:1.5vw;border-top:1px dashed rgba(255,255,255,.15);display:flex;gap:1.5vw;justify-content:flex-end;flex-wrap:wrap;">
      <button onclick="deleteMyPost('${escapeHtml(p.id)}')" style="padding:1.5vw 2.5vw;background:rgba(230,40,54,.2);border:1px solid #e62836;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">🗑️ 删除</button>
      <button onclick="toggleMyPost('${escapeHtml(p.id)}','${p.status}')" style="padding:1.5vw 2.5vw;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">${p.status === 'closed' ? '✅ 重新上架' : '📥 下架'}</button>
    </div>` : '';
  return `<div class="post-item" style="background:rgba(255,255,255,.05);padding:3vw;border-radius:8px;margin-bottom:2vw;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="post-title" style="font-weight:bold;font-size:4.2vw;color:#fff;">${escapeHtml(p.title)}</div>
      ${pinnedMark}
    </div>
    <div class="post-meta" style="font-size:2.8vw;color:rgba(255,255,255,.5);margin:.5vw 0 1.5vw;">${escapeHtml(p.author_name || p.author || '-')} · ${fmtTime(p.created_at)}${p.status === 'closed' ? ' <span style="color:#ff4d5a;">【已下架】</span>' : ''}</div>
    ${imageHtml}
    <div class="post-content" style="font-size:3.2vw;color:rgba(255,255,255,.85);margin-bottom:2vw;">${escapeHtml(p.content || '')}</div>
    ${(p.bounty_gold || p.bounty_item) ? `
      <div class="post-bounty" style="background:rgba(255,215,0,.1);padding:2vw;border-radius:6px;border:1px solid rgba(255,215,0,.3);margin-bottom:1.5vw;">
        <span style="color:#ffd700;font-weight:bold;">🎁 悬赏：</span>
        <span style="color:#fff;">${p.bounty_gold||0}玄币${p.bounty_item ? ' +物品' : ''}</span>
        <span style="color:rgba(255,255,255,.4);font-size:2.8vw;margin-left:2vw;">（最多 ${maxN} 人）</span>
      </div>` : ''}
    ${claimersHtml}
    ${myBtns}
  </div>`;
}

async function loadPosts() {
  const res = await api('/api/posts');
  const c = $("content-posts");
  // 即使没帖子，也要显示顶部按钮
  if (!res.ok || !res.posts || !res.posts.length) {
    c.innerHTML = PLAYER_POST_TOOLBAR + '<div class="empty">暂无帖子</div>';
    return;
  }
  const sortByOrder = (a, b) => {
    const pa = a.pin_order || 0, pb = b.pin_order || 0;
    if (pa !== pb) return pa - pb;
    return (b.created_at || 0) - (a.created_at || 0);
  };
  // 5 个分区分桶（未知 area 兜底 chat）
  const buckets = {};
  POST_AREA_BUCKETS.forEach(b => buckets[b.key] = []);
  res.posts.forEach(p => {
    const key = buckets[p.area] ? p.area : 'chat';
    buckets[key].push(p);
  });
  Object.values(buckets).forEach(arr => arr.sort(sortByOrder));
  let html = PLAYER_POST_TOOLBAR;
  POST_AREA_BUCKETS.forEach(b => {
    const list = buckets[b.key];
    const body = list.length
      ? list.map(renderPostCard).join('')
      : '<div class="empty" style="padding:4vw 0;font-size:3vw;">该分区暂无内容</div>';
    // 置顶区默认展开，其他 4 区默认折叠
    const collapsed = b.key === 'pinned' ? '' : ' collapsed';
    html += `<div class="collapse-wrap${collapsed}" style="margin-bottom:3vw;padding:2vw;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;">
      <div class="collapse-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <span style="font-size:3.4vw;font-weight:bold;color:${b.color};">${b.cn}（${list.length}）</span>
        <span class="collapse-arrow">▼</span>
      </div>
      <div class="collapse-body"><div class="posts-list">${body}</div></div>
    </div>`;
  });
  c.innerHTML = html;
  c.querySelectorAll('.claim-btn').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); claimBounty(btn.dataset.id); };
  });
}

async function claimBounty(postId) {
  const res = await api('/api/claimBounty', { dm: curId, postId });
  if (res.error) return toast(res.error, 'err');
  toast('已接悬赏！等待 admin 标记完成', 'ok', 2000);
  loadPosts();
}

// 玩家端：管理我的帖子列表（包括上架+已下架，按 uid 查自己）
async function showManageMyPosts() {
  const res = await api('/api/myPosts?uid=' + encodeURIComponent(curPlayer.uid));
  const all = (res.ok && res.posts) ? res.posts : [];
  const myPosts = all
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  if (!myPosts.length) {
    showModal('📋 我的帖子', '<div class="empty">你还没发过帖</div>', null, '关闭', null, true);
    return;
  }
  const areaName = (a) => ({ chat: '💬 闲聊', special: '✨ 特殊', general: '📋 常规', bounty: '🎯 悬赏', pinned: '📌 置顶' })[a] || '💬 闲聊';
  // 统计：上架中 / 已下架
  const live = myPosts.filter(p => p.status !== 'closed').length;
  const closed = myPosts.length - live;
  let html = `<div style="font-size:3vw;color:rgba(255,255,255,.6);margin-bottom:2vw;">共 ${myPosts.length} 条（<span style="color:#2ee84e;">在架 ${live}</span> / <span style="color:#ff4d5a;">已下架 ${closed}</span>）</div>`;
  html += '<div style="display:flex;flex-direction:column;gap:2vw;max-height:65vh;overflow-y:auto;">';
  myPosts.forEach(p => {
    const isClosed = p.status === 'closed';
    const status = isClosed ? '<span style="color:#ff4d5a;">📥 已下架</span>' : '<span style="color:#2ee84e;">✅ 上架中</span>';
    // 按用户要求：只保留 删除 + 下架/上架；"编辑内容"按钮已去掉
    html += `<div style="background:rgba(255,255,255,.05);padding:2.5vw;border-radius:8px;border-left:3px solid ${isClosed ? '#ff4d5a' : '#2ee84e'};">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1vw;">
        <div style="font-weight:bold;font-size:3.6vw;color:#fff;">${escapeHtml(p.title)}</div>
        <div style="font-size:2.6vw;color:rgba(255,255,255,.6);">${status}</div>
      </div>
      <div style="font-size:2.8vw;color:rgba(255,255,255,.55);margin-bottom:1.5vw;">
        ${areaName(p.area)} · ${fmtTime(p.created_at)}
      </div>
      <div style="display:flex;gap:1.5vw;flex-wrap:wrap;">
        <button data-del="${escapeHtml(p.id)}" style="padding:1.5vw 2.5vw;background:rgba(230,40,54,.2);border:1px solid #e62836;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">🗑️ 删除</button>
        <button data-toggle="${escapeHtml(p.id)}" data-cur="${p.status}" style="padding:1.5vw 2.5vw;background:${isClosed ? 'rgba(46,232,78,.2);border:1px solid #2ee84e' : 'rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3)'};color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">${isClosed ? '✅ 重新上架' : '📥 下架'}</button>
      </div>
    </div>`;
  });
  html += '</div>';
  showModal('📋 我的帖子', html, null, '关闭', null, true);
  // 用事件委托（因为按钮 onclick 在 setTimeout 后才绑定会有 race，改用 delegation）
  setTimeout(() => {
    const modal = $("modal");
    if (!modal) return;
    // 删除（玩家自己的帖子）
    modal.querySelectorAll('button[data-del]').forEach(btn => {
      btn.onclick = () => deleteMyPost(btn.dataset.del);
    });
    // 上下架
    modal.querySelectorAll('button[data-toggle]').forEach(btn => {
      btn.onclick = () => toggleMyPost(btn.dataset.toggle, btn.dataset.cur);
    });
  }, 80);
}

// ============ 图片上传（玩家端复用 admin 逻辑 + 4:3 横向长方形裁剪）============
// 4:3 比例的"画布中央裁剪"：保证所有帖子的图片区域比例一致
function cropToHorizontal(img, maxWidth) {
  const targetRatio = 4 / 3;  // 4:3 横向（宽比高）
  let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;
  // 原图当前比例
  const curRatio = img.width / img.height;
  if (curRatio > targetRatio) {
    // 太宽 → 裁剪左右
    srcW = Math.round(img.height * targetRatio);
    srcX = Math.round((img.width - srcW) / 2);
  } else if (curRatio < targetRatio) {
    // 太窄 → 裁剪上下
    srcH = Math.round(img.width / targetRatio);
    srcY = Math.round((img.height - srcH) / 2);
  }
  // 输出宽度不超过 maxWidth（保持 4:1）
  const outW = Math.min(maxWidth, srcW);
  const outH = Math.round(outW / targetRatio);
  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, outW, outH);
  ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
  return canvas;
}

// 处理图片：读 → 4:1 裁剪 → 逐档压缩到 ≤ 250KB base64
async function processImage(file) {
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = ev => resolve(ev.target.result);
    r.onerror = () => reject(new Error('读取失败'));
    r.readAsDataURL(file);
  });
  if (dataUrl.length < 250 * 1024) return dataUrl;  // 够小直接返回
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error('图片解码失败'));
    i.src = dataUrl;
  });
  // 三档尺寸（最大边）：1024 → 800 → 640；裁剪后按 4:1 输出
  const tiers = [
    { w: 1024, qs: [0.7, 0.6, 0.5] },
    { w: 800,  qs: [0.55, 0.45, 0.35] },
    { w: 640,  qs: [0.4, 0.3] },
  ];
  for (const tier of tiers) {
    const canvas = cropToHorizontal(img, tier.w);
    for (const q of tier.qs) {
      const out = canvas.toDataURL('image/jpeg', q);
      if (out.length < 250 * 1024) return out;
    }
  }
  throw new Error('图片无法压缩到安全大小（请用画图工具手动压到 200KB 以内再上传）');
}

// 把 <input type=file> + 目标 textarea + 预览图 绑成一组
function bindImageUpload(fileId, textareaId, previewId) {
  const fileEl = $(fileId);
  const taEl = $(textareaId);
  const previewEl = $(previewId);
  if (!fileEl || !taEl || !previewEl) return;
  const initVal = taEl.value.trim();
  if (initVal.startsWith('data:image/')) {
    previewEl.src = initVal;
    previewEl.style.display = 'inline-block';
  }
  fileEl.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) return toast('请选择图片文件', 'err');
    toast('正在处理图片（4:1 裁剪中）…');
    processImage(f).then(dataUrl => {
      taEl.value = dataUrl;
      previewEl.src = dataUrl;
      previewEl.style.display = 'inline-block';
      const sizeKB = Math.round(dataUrl.length / 1024 * 0.75);
      toast('已就绪（约 ' + sizeKB + 'KB）');
    }).catch(err => toast('处理失败：' + err.message, 'err'));
  });
}

// ============ 全局折叠状态保留（重渲染时不重置用户的展开/折叠）============
function captureCollapseState(rootSelector) {
  const root = $(rootSelector);
  if (!root) return {};
  const map = {};
  root.querySelectorAll('.collapse-wrap').forEach(el => {
    // 用父容器 selector + collapse 标题文字作为唯一 key
    const title = el.querySelector('.collapse-head')?.innerText?.trim() || el.outerHTML.slice(0, 60);
    if (!title) return;
    map[title] = el.classList.contains('collapsed');
  });
  return map;
}
function restoreCollapseState(rootSelector, saved) {
  if (!saved) return;
  const root = $(rootSelector);
  if (!root) return;
  root.querySelectorAll('.collapse-wrap').forEach(el => {
    const title = el.querySelector('.collapse-head')?.innerText?.trim() || el.outerHTML.slice(0, 60);
    if (!title) return;
    // 默认按 HTML 上的 collapsed 类（即默认状态），用户上次展开过则强制展开
    if (saved[title]) el.classList.add('collapsed');
    else el.classList.remove('collapsed');
  });
}
// 通用包装：先捕获当前折叠状态 → 重渲染 → 恢复
function captureAndRefreshAroundScope(rootSelector, refreshFn) {
  const saved = captureCollapseState(rootSelector);
  refreshFn();
  // loadShop() 是同步设 innerHTML，但 showFriends 等 Promise 链需要 setTimeout 0
  setTimeout(() => restoreCollapseState(rootSelector, saved), 0);
}

// 道具 effect JSON → 中文文本（前端粗略渲染；后端另有一份 ATTR_CN 服务端权威版）
function effectToTextClient(eff) {
  const cn = { gold:'玄币', stock:'蓝条', health:'健康', debt:'欠款', spirit:'精神', sense:'感知', body:'体魄', agile:'敏捷', charm:'魅力', blood:'血脉', wisdom:'悟性', lv:'等级' };
  if (!eff || typeof eff !== 'object') return '';
  return Object.keys(eff).map(k => {
    const v = eff[k];
    if (typeof v !== 'number') return '';
    const sign = v > 0 ? '+' : '';
    return `${sign}${v} ${cn[k] || k}`;
  }).filter(Boolean).join('，');
}

  // 先拿背包当前数量

  const item = (inv.ok && inv.items) ? inv.items.find(x => x.item_id === itemId) : null;
  // 防御：背包里找不到就直接提示，不要弹一个没意义的数量窗口
  if (!item) {
    toast('背包里没有此道具', 'err', 2000);
    return;
  }
  const maxQty = item.qty || 1;
  showModal(`✨ 使用 ${escapeHtml(item.name)}`, `
    <div style="text-align:center;font-size:3.6vw;color:rgba(255,255,255,.7);margin-bottom:2vw;">背包现有 <b style="color:#ffd700;">${maxQty}</b> 个，本次使用多少？</div>
    <input id="useQty" type="number" min="1" max="${maxQty}" value="1" autocomplete="off"
      style="width:100%;padding:2vw;background:#222;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:4px;text-align:center;font-size:4vw;">
  `, async () => {
    const raw = parseInt($("useQty").value);
    if (!raw || raw < 1) return toast('请输入有效数量', 'err', 1500);
    const qty = Math.min(raw, maxQty);
    // 立即给反馈（防止用户感觉"点了没反应"）
    toast('正在使用…', 'ok', 800);
    try {
      const res = await api('/api/useItem', { dm: curId, item_id: itemId, qty });
      if (res.error) return toast(res.error, 'err', 2500);
      closeModal();
      toast(`✨ ${res.itemName} ×${res.qty} 已使用`, 'ok', 1500);
      if (res.player) { curPlayer = res.player; renderPlayer(); }
      // 注意：系统公告在前端重复推一次会重复显示，所以这里**不**再 sysTip（后端已推）
      await showInventory();
    } catch (e) {
      toast('使用失败：' + (e.message || e), 'err', 2500);
    }
  }, '使用');
}

// 删除（丢弃一个，扣库存不应用 effect）
async function discardItem(itemId) {
  // 先拉背包当前数量，弹数量窗口
  const inv = await api('/api/inventory?id=' + encodeURIComponent(curId));
  const item = (inv.ok && inv.items) ? inv.items.find(x => x.item_id === itemId) : null;
  if (!item || (item.qty || 0) <= 0) return toast('背包里没有这个道具', 'err', 1500);
  const maxQty = item.qty || 1;
  showModal(`🗑️ 丢弃 ${escapeHtml(item.name)}`, `
    <div style="text-align:center;font-size:3.6vw;color:rgba(255,255,255,.7);margin-bottom:2vw;">背包现有 <b style="color:#ffd700;">${maxQty}</b> 个，本次丢弃多少？</div>
    <input id="discardQty" type="number" min="1" max="${maxQty}" value="1" autocomplete="off"
      style="width:100%;padding:2vw;background:#222;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:4px;text-align:center;font-size:4vw;">
    <div style="margin-top:1.5vw;font-size:2.6vw;color:rgba(255,77,90,.7);text-align:center;">⚠️ 此操作不可撤销</div>
  `, async () => {
    const raw = parseInt($("discardQty").value);
    if (!raw || raw < 1) return toast('请输入有效数量', 'err', 1500);
    const qty = Math.min(raw, maxQty);
    if (!confirm(`确认丢弃 ${escapeHtml(item.name)} ×${qty}？此操作不可撤销。`)) return;
    toast('正在丢弃…', 'ok', 600);
    try {
      const res = await api('/api/discardItem', { dm: curId, item_id: itemId, qty });
      if (res.error) return toast(res.error, 'err', 2500);
      closeModal();
      toast(`🗑️ 已丢弃 ×${qty}`, 'ok', 1500);
      await showInventory();
    } catch (e) {
      toast('丢弃失败：' + (e.message || e), 'err', 2500);
    }
  }, '丢弃');
}

// 赠送道具：先弹数量，再选好友
async function giveItemToPlayer(itemId, itemName) {
  // 先拿背包当前数量
  const inv = await api('/api/inventory?id=' + encodeURIComponent(curId));
  const item = (inv.ok && inv.items) ? inv.items.find(x => x.item_id === itemId) : null;
  const maxQty = (item && item.qty) || 1;
  showModal(`🎁 赠送 ${itemName}`, `
    <div style="text-align:center;font-size:3.6vw;color:rgba(255,255,255,.7);margin-bottom:2vw;">背包现有 <b style="color:#ffd700;">${maxQty}</b> 个，本次赠送多少？</div>
    <input id="giftQty" type="number" min="1" max="${maxQty}" value="1"
      style="width:100%;padding:2vw;background:#222;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:4px;text-align:center;font-size:4vw;">
  `, async () => {
    const qty = Math.min(Math.max(parseInt($("giftQty").value) || 1, 1), maxQty);
    closeModal();
    const fr = await api('/api/friends?id=' + encodeURIComponent(curId));
    const friends = (fr.ok && fr.friends) ? fr.friends : [];
    if (!friends.length) {
      return showModal('赠送道具', `<div class="empty">暂无好友，先去添加好友吧</div>`, () => {}, '关闭');
    }
    let html = '<div style="display:flex;flex-direction:column;gap:2vw;max-height:60vh;overflow-y:auto;">';
    friends.forEach(f => {
      html += `<button data-friend-id="${escapeHtml(f.id)}" data-friend-name="${escapeHtml(f.name)}"
        style="padding:3vw;background:rgba(46,232,78,.15);border:1px solid rgba(46,232,78,.4);color:#fff;border-radius:6px;font-size:3.4vw;cursor:pointer;text-align:left;">
        <b>${escapeHtml(f.name)}</b> <span style="color:rgba(255,255,255,.5);font-size:2.6vw;">Lv.${f.lv||1} · ${escapeHtml(f.sect||'散人')}</span>
      </button>`;
    });
    html += '</div>';
    showModal(`🎁 赠送 ${itemName} ×${qty} 给…`, html, null, '关闭', null, true, () => {
      document.querySelectorAll('#modal [data-friend-id]').forEach(btn => {
        btn.onclick = async () => {
          const toId = btn.dataset.friendId;
          const toName = btn.dataset.friendName;
          if (!confirm(`确认赠送 ${itemName} ×${qty} 给 ${toName}？`)) return;
          const r = await api('/api/giveItem', { dm: curId, to_id: toId, item_id: itemId, qty });
          if (r.error) return toast(r.error, 'err');
          toast(`🎁 已送给 ${toName} ×${qty}`, 'ok', 1500);
          // 后端 apiGiveItem 已推送 tip（绿行），前端不重复
          closeModal();
          await showInventory();
        };
      });
    });
  }, '下一步');
}

// ============ 技能 ============
// 修行技能（v2）：门派 + 技能 + 升级 + 使用 + 转移
// 门派和副业是两块独立区域，单独折叠，单独标题；不绑也能看另一边
async function showSkills() {
  const c = $("content-skills");
  c.innerHTML = '<div class="empty">加载中…</div>';
  switchTab('skills');
  const [res, invRes, sjRes] = await Promise.all([
    api('/api/sectSkills?id=' + encodeURIComponent(curId)),
    api('/api/inventory?id=' + encodeURIComponent(curId)).catch(() => ({ ok: true, items: [] })),
    api('/api/sidejobSkills?id=' + encodeURIComponent(curId)).catch(() => ({ ok: true, sidejobs: [] })),
  ]);
  const sects = (res.ok && res.sects) ? res.sects : [];
  const sidejobs = (sjRes.ok && sjRes.sidejobs) ? sjRes.sidejobs : [];
  // 两边都没绑定：友好提示
  if (!sects.length && !sidejobs.length) {
    c.innerHTML = '<div class="empty">尚未绑定任何门派/副业，等待 admin 分配</div><button class="back-btn" onclick="switchTab(\'profile\')">返回</button>';
    return;
  }
  const playerLv = (res.ok && res.playerLv) || (sjRes.ok && sjRes.playerLv) || 1;
  const stock = (res.ok && res.stock) || (sjRes.ok && sjRes.stock) || 0;
  // 背包道具 → 数量 映射（升级道具判断用）
  const invMap = {};
  ((invRes.ok && invRes.items) ? invRes.items : []).forEach(it => { invMap[it.item_id] = (invMap[it.item_id] || 0) + (it.qty || 0); });
  // 道具 id → 名称 映射（用于升级/修炼提示文案）
  const invName = {};
  ((invRes.ok && invRes.items) ? invRes.items : []).forEach(it => { invName[it.item_id] = it.name || it.item_id; });
  let html = `<div style="font-size:3vw;color:rgba(255,255,255,.6);margin-bottom:2vw;">当前等级 Lv.${playerLv} · 蓝条 ${stock}</div>`;

  // ============ 门派区（独立折叠区域）============
  if (sects.length) {
    sects.forEach(sect => {
      const pageKey = 'skills_' + sect.id;
      _pagerSet(pageKey, sect.skills || [], s => {
        const greyed = !s.reachable;
        const opacity = greyed ? 'opacity:.45;' : '';
        const lblUnlocked = s.unlocked ? `<span style="color:#2ee84e;">✓ 已解锁 Lv.${s.level || 0}</span>` : (greyed ? '<span style="color:#888;">🔒 未达等级 ' + s.lv_required + '</span>' : '<span style="color:#ffd700;">⚡ 可学习</span>');
        let showUpgrade = false;
        if (s.unlocked) {
          if (s.upgrade_cost_item_id) {
            const need = s.upgrade_cost_item_qty || 1;
            const have = invMap[s.upgrade_cost_item_id] || 0;
            if (have >= need) showUpgrade = true;
          } else {
            showUpgrade = true;
          }
        }
        const useTip = s.blue_cost > 0 ? `-${s.blue_cost}蓝` : '';
        // 升级按钮传给函数：道具 id + 名称 + 数量
        const upItemId = s.upgrade_cost_item_id || '';
        const upItemName = upItemId ? (invName[upItemId] || upItemId) : '';
        const upQty = s.upgrade_cost_item_qty || 0;
        return `<div style="background:rgba(255,255,255,.05);padding:2vw;border-radius:6px;${opacity}">
          <div style="display:flex;align-items:center;gap:2vw;">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:bold;font-size:3.4vw;color:#fff;">${escapeHtml(s.name)} <span style="font-size:2.6vw;color:rgba(255,255,255,.5);">${s.unlocked ? 'Lv.' + (s.level||0) : 'Lv.' + (s.lv_required||0) + '+'}</span></div>
              ${(!s.unlocked) ? `<div style="font-size:2.4vw;color:rgba(255,255,255,.55);margin-top:.3vw;">${greyed ? '<span style="color:#888;">🔒 未达等级 ' + s.lv_required + '</span>' : '<span style="color:#ffd700;">⚡ 可学习</span>'}</div>` : ''}
              ${s.desc ? `<div style="font-size:2.6vw;color:rgba(255,255,255,.65);margin-top:.3vw;line-height:1.4;">${escapeHtml(s.desc)}</div>` : ''}
            </div>
            <div style="display:flex;gap:1vw;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:32vw;">
              ${(!s.unlocked && s.reachable) ? `<button onclick="learnSectSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" style="padding:1.5vw 2.5vw;background:#2ee84e;color:#000;border:none;border-radius:5px;font-size:2.8vw;font-weight:bold;cursor:pointer;">学习</button>` : ''}
              ${showUpgrade ? `<button onclick="upgradeSectSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}','${escapeHtml(upItemId)}','${escapeHtml(upItemName)}',${upQty})" style="padding:1.5vw 2.5vw;background:rgba(77,140,255,.2);border:1px solid #4d8cff;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">升级</button>` : ''}
              ${s.unlocked ? `<button onclick="useSectSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" title="${escapeHtml(useTip)}" style="padding:1.5vw 2.5vw;background:rgba(46,232,78,.2);border:1px solid #2ee84e;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">使用${useTip ? ' '+useTip : ''}</button>` : ''}
              ${s.unlocked && s.transferrable ? `<button onclick="transferSectSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" style="padding:1.5vw 2.5vw;background:rgba(255,215,0,.2);border:1px solid #ffd700;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">传授</button>` : ''}
            </div>
          </div>
        </div>`;
      });
      const slice = pagerSlice(pageKey);
      // 门派也默认折叠（按 sect.collapsed 字段决定）
      const wrapCls = 'collapse-wrap' + (sect.collapsed ? ' collapsed' : '');
      html += `<div class="${wrapCls}" style="margin-bottom:3vw;background:rgba(255,255,255,.04);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:2vw;">
        <div class="collapse-head" onclick="this.parentElement.classList.toggle('collapsed')" style="font-weight:bold;color:#ffd700;font-size:3.6vw;cursor:pointer;">
          <span>📜 ${escapeHtml(sect.name)} · ${escapeHtml(sect.profession||'')}<span style="color:rgba(255,255,255,.5);font-size:2.8vw;font-weight:normal;">（${(sect.skills||[]).length}）</span></span>
          <span class="collapse-arrow">▼</span>
        </div>
        <div class="collapse-body">
          <div data-pager-key="${pageKey}">${slice.map(_pagerRender[pageKey]).join('')}${pagerHtml(pageKey)}</div>
        </div>
      </div>`;
    });
  }

  // ============ 副业区（独立折叠区域，与门派完全分离）============
  if (sidejobs.length) {
    sidejobs.forEach(sj => {
      const pageKey = 'sj_' + sj.id;
      _pagerSet(pageKey, sj.skills || [], s => {
        const greyed = !s.reachable;
        const opacity = greyed ? 'opacity:.45;' : '';
        const lvTag = s.lv_required ? `Lv.${s.lv_required}+` : `Lv.不限 · 次数: ${s.count}`;
        const countTxt = s.lv_required ? `次数: ${s.count}` : '';
        // 修炼按钮：道具够时才显示
        let showCultivate = false;
        if (s.cost_item_id) {
          const need = s.cost_item_qty || 1;
          const have = invMap[s.cost_item_id] || 0;
          if (have >= need) showCultivate = true;
        }
        // 升级/修炼用：道具 id + 名称 + 数量 + 获得次数
        const costItemId = s.cost_item_id || '';
        const costItemName = costItemId ? (invName[costItemId] || costItemId) : '';
        const costQty = s.cost_item_qty || 0;
        const gainQty = s.gain_qty || 1;
        return `<div style="background:rgba(255,255,255,.05);padding:2vw;border-radius:6px;${opacity}">
          <div style="display:flex;align-items:center;gap:2vw;">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:bold;font-size:3.4vw;color:#fff;">${escapeHtml(s.name)} <span style="font-size:2.6vw;color:rgba(255,255,255,.5);">${lvTag}</span></div>
              ${countTxt ? `<div style="font-size:2.4vw;color:rgba(255,255,255,.55);margin-top:.3vw;">${countTxt}${greyed ? ' <span style="color:#888;">🔒 未达等级</span>' : ''}</div>` : (greyed ? `<div style="font-size:2.4vw;color:#888;margin-top:.3vw;">🔒 未达等级 ${s.lv_required}</div>` : '')}
              ${s.desc ? `<div style="font-size:2.6vw;color:rgba(255,255,255,.65);margin-top:.3vw;line-height:1.4;">${escapeHtml(s.desc)}</div>` : ''}
            </div>
            <div style="display:flex;gap:1vw;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:34vw;">
              ${showCultivate ? `<button onclick="cultivateSidejobSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}','${escapeHtml(costItemId)}','${escapeHtml(costItemName)}',${costQty},${gainQty})" style="padding:1.5vw 2.5vw;background:rgba(192,132,252,.2);border:1px solid #c084fc;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">修炼</button>` : ''}
              ${s.count >= 1 ? `<button onclick="useSidejobSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" style="padding:1.5vw 2.5vw;background:rgba(46,232,78,.2);border:1px solid #2ee84e;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">使用</button>` : ''}
              ${s.count >= 1 ? `<button onclick="discardSidejobSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" style="padding:1.5vw 2.5vw;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">删除</button>` : ''}
              ${s.count >= 1 && s.transferrable ? `<button onclick="transferSidejobSkill('${escapeHtml(s.id)}','${escapeHtml(s.name)}')" style="padding:1.5vw 2.5vw;background:rgba(255,215,0,.2);border:1px solid #ffd700;color:#fff;border-radius:5px;font-size:2.8vw;cursor:pointer;">传授</button>` : ''}
            </div>
          </div>
        </div>`;
      });
      const slice2 = pagerSlice(pageKey);
      const wrapCls = 'collapse-wrap' + (sj.collapsed ? ' collapsed' : '');
      html += `<div class="${wrapCls}" style="margin-bottom:3vw;background:rgba(192,132,252,.06);border:1px solid rgba(192,132,252,.3);border-radius:8px;padding:2vw;">
        <div class="collapse-head" onclick="this.parentElement.classList.toggle('collapsed')" style="font-weight:bold;color:#c084fc;font-size:3.6vw;cursor:pointer;">
          <span>🛠️ ${escapeHtml(sj.name)}${sj.note ? ` <span style="font-size:2.6vw;color:rgba(255,255,255,.5);font-weight:normal;">${escapeHtml(sj.note)}</span>` : ''}<span style="color:rgba(255,255,255,.5);font-size:2.8vw;font-weight:normal;">（${(sj.skills||[]).length}）</span></span>
          <span class="collapse-arrow">▼</span>
        </div>
        <div class="collapse-body">
          <div data-pager-key="${pageKey}">${slice2.map(_pagerRender[pageKey]).join('')}${pagerHtml(pageKey)}</div>
        </div>
      </div>`;
    });
  }

  html += '<button class="back-btn" onclick="switchTab(\'profile\')">返回</button>';
  c.innerHTML = html;
}

async function learnSectSkill(skillId, skillName) {
  const r = await api('/api/sectLearnSkill', { dm: curId, skill_id: skillId });
  if (r.error) return toast(r.error, 'err');
  toast('已学习！', 'ok', 1500);
  sysTip(`【${curPlayer.name}】学习了【${skillName}】`);
  showSkills();
}
async function upgradeSectSkill(skillId, skillName, itemId, itemName, qty) {
  // 文案：是否消耗【道具名称】x数量进行升级
  const msg = itemId
    ? `是否消耗【${itemName}】x${qty}进行升级？`
    : `升级【${skillName}】（无道具消耗）？`;
  if (!confirm(msg)) return;
  const r = await api('/api/sectUpgradeSkill', { dm: curId, skill_id: skillId });
  if (r.error) return toast(r.error, 'err');
  toast(`✨ ${skillName} → Lv.${r.newLevel}`, 'ok', 1500);
  sysTip(`【${curPlayer.name}】升级了【${skillName}】`);
  showSkills();
  // 刷新玩家数据
  const me = await api('/api/login', { dm: curId });
  if (me.ok) { curPlayer = me.player; renderPlayer(); }
}
async function useSectSkill(skillId, skillName) {
  // 直接执行；后端已推送 chat tip 到绿行，这里不重复推
  const r = await api('/api/sectUseSkill', { dm: curId, skill_id: skillId });
  if (r.error) return toast(r.error, 'err');
  const me = await api('/api/login', { dm: curId });
  if (me.ok) { curPlayer = me.player; renderPlayer(); }
  // 同步刷新技能列表（蓝条可能已变化，状态可能改变）
  showSkills();
}
async function transferSectSkill(skillId, skillName) {
  const fr = await api('/api/friends?id=' + encodeURIComponent(curId));
  const friends = (fr.ok && fr.friends) ? fr.friends : [];
  if (!friends.length) return toast('暂无好友', 'err');
  // 先拉技能定义，拿到升级消耗数量用于提示文案
  let halfTip = '';
  try {
    const skillRes = await api('/api/sectSkills?id=' + encodeURIComponent(curId));
    const allSkills = [];
    ((skillRes.ok && skillRes.sects) || []).forEach(s => s.skills.forEach(k => allSkills.push(k)));
    const s = allSkills.find(k => k.id === skillId);
    if (s && s.upgrade_cost_item_id) {
      const need = Math.max(1, Math.ceil((s.upgrade_cost_item_qty || 1) / 2));
      halfTip = `\n（会从背包扣除 ${s.upgrade_cost_item_id} ×${need}，即升级消耗的一半）`;
    }
  } catch(e) {}
  let html = '<div style="display:flex;flex-direction:column;gap:2vw;max-height:60vh;overflow-y:auto;">';
  friends.forEach(f => {
    html += `<button data-to-id="${escapeHtml(f.id)}" data-to-name="${escapeHtml(f.name)}"
      style="padding:3vw;background:rgba(255,215,0,.15);border:1px solid #ffd700;color:#fff;border-radius:6px;font-size:3.4vw;cursor:pointer;text-align:left;">
      <b>${escapeHtml(f.name)}</b> <span style="color:rgba(255,255,255,.5);font-size:2.6vw;">Lv.${f.lv||1}</span>
    </button>`;
  });
  html += '</div>';
  showModal(`传授【${skillName}】给好友`, html, null, '关闭', null, true, () => {
    document.querySelectorAll('#modal [data-to-id]').forEach(btn => {
      btn.onclick = async () => {
        const toId = btn.dataset.toId;
        const toName = btn.dataset.toName;
        if (!confirm(`确认传授【${skillName}】给 ${toName}？${halfTip}\n传授后你仍保留此技能，对方无需重新学习。`)) return;
        const r = await api('/api/sectTransferSkill', { dm: curId, skill_id: skillId, to_id: toId });
        if (r.error) return toast(r.error, 'err');
        toast(`已传授给 ${toName}`, 'ok', 1500);
        // 后端已推 chat tip（"【A】将【技能】×N 传授给了【B】"），前端不重复推
        closeModal();
        // 同步刷新：修为灵力面板 + 玩家属性栏（含精神/蓝条）
        showSkills();
        try {
          const me = await api('/api/login', { dm: curId });

        } catch(e) {}
      };
    });

}

async function useSidejobSkill(skillId, skillName) {
  const input = prompt(`使用【${skillName}】（输入要使用的次数）：`, '1');

// 同意好友申请
async function acceptFriendRequest(reqId) {
  // 先从当前好友申请列表里查对方名字（避免额外请求）
  let peerName = '玩家';
  try {
    const r = await api('/api/friendRequests?id=' + encodeURIComponent(curId));
    const inc = (r.ok && r.incoming) ? r.incoming : [];
    const found = inc.find(x => String(x.id) === String(reqId));
    if (found) peerName = found.from_name || peerName;
  } catch(e) {}
  const res = await api('/api/friendAccept', { dm: curId, requestId: reqId });
  if (res.error) return toast(res.error, 'err');
  toast('已同意');
  sysTip(`【${curPlayer.name}】同意了【${peerName}】的好友申请`);
  await loadFriendIds();
  showFriends();
}

async function rejectFriendRequest(reqId) {
  let peerName = '玩家';
  try {
    const r = await api('/api/friendRequests?id=' + encodeURIComponent(curId));
    const inc = (r.ok && r.incoming) ? r.incoming : [];
    const found = inc.find(x => String(x.id) === String(reqId));
    if (found) peerName = found.from_name || peerName;
  } catch(e) {}
  const res = await api('/api/friendReject', { dm: curId, requestId: reqId });
  if (res.error) return toast(res.error, 'err');
  toast('已拒绝');
  sysTip(`【${curPlayer.name}】拒绝了【${peerName}】的好友申请`);
  showFriends();
}

// ============ 私聊窗口（浮动，可多开）============
if (!window._chatWindows) window._chatWindows = {};

async function openChatWindow(friendId, friendName) {
  closeModal();
  // 已开就 focus
  if (window._chatWindows[friendId]) {
    const box = window._chatWindows[friendId];
    box.style.display = 'flex';
    $("chatInput-" + friendId)?.focus();
    return;
  }
  const box = document.createElement('div');
  box.id = 'chatBox-' + friendId;
  box.className = 'chat-box';
  box.dataset.friendId = friendId;
  box.innerHTML = `
    <div class="chat-head">
      <span>💬 与 <b>${escapeHtml(friendName)}</b> 私聊</span>
      <span class="chat-close" onclick="closeChatWindow('${friendId}')">×</span>
    </div>
    <div class="chat-msgs" id="chatMsgs-${friendId}"></div>
    <div class="chat-input-row">
      <input id="chatInput-${friendId}" maxlength="500" placeholder="说点什么...（最多 500 字）" onkeydown="if(event.key==='Enter'){sendChat('${friendId}');}">
      <button onclick="sendChat('${friendId}')">发送</button>
    </div>
  `;
  document.body.appendChild(box);
  window._chatWindows[friendId] = box;
  await loadChatHistory(friendId);
}

function closeChatWindow(friendId) {
  const box = window._chatWindows[friendId];
  if (box) box.remove();
  delete window._chatWindows[friendId];
}

// 点击气泡复制内容
function copyChatMsg(el) {
  const text = el.textContent || '';
  if (!text) return;
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
  toast('已复制', 'ok', 1200);
}

async function loadChatHistory(friendId) {
  const res = await api('/api/chatHistory?id=' + encodeURIComponent(curId) + '&friendId=' + encodeURIComponent(friendId));
  const list = $("chatMsgs-" + friendId);
  if (!list) return;
  // 智能滚动：刷新前如果用户已经在底部（差 50px 内），刷新后继续滚到底；否则保留位置
  const wasAtBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 50;
  if (!res.ok || !res.messages) { list.innerHTML = '<div class="empty">暂无消息</div>'; return; }
  list.innerHTML = res.messages.map(m => {
    const mine = m.from_id === curId;
    return `<div class="chat-msg ${mine ? 'mine' : 'theirs'}" data-mid="${escapeHtml(m._id||'')}">
      <div class="chat-bubble" onclick="copyChatMsg(this)" title="点击复制">${escapeHtml(m.content)}</div>
      <div class="chat-time">${fmtTimeFull(m.created_at)}</div>
    </div>`;
  }).join('');
  if (wasAtBottom) list.scrollTop = list.scrollHeight;
}

// 全局每 5 秒轮询所有打开的聊天窗口
async function pollOpenChats() {
  for (const fid of Object.keys(window._chatWindows || {})) {
    if (!window._chatWindows[fid]) continue;
    await loadChatHistory(fid);
  }
}
